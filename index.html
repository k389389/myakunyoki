<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EXPO2025 すごろく（オンラインマルチプレイヤー拡張版）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { 
      width: 100%; 
      height: auto; 
      min-height: 100vh; 
      font-family: sans-serif; 
      background: #f0f4f8; 
      overflow-y: auto !important; /* スマホでの縦スクロールを確実に許可 */
      -webkit-overflow-scrolling: touch; 
    }
    body { display: block; height: auto; touch-action: manipulation; }
    /* スマホの連打でダブルタップズームが発生しないようにする */
    button, .reaction-btn, .myaku-nyokki-btn, .mushroom-time-btn {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
    .main-container { 
      display: flex; 
      flex-direction: column; 
      width: 100%; 
      min-height: 100vh; 
      height: auto; 
    }
    @media (min-width: 768px) {
      .main-container { flex-direction: row; height: 100vh; overflow: hidden; min-height: auto; }
    }
    
    .board-container { 
      position: relative; 
      background: #e3f2fd; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      width: 100%; 
      height: 380px; /* スマホでスクロールできるように高さを固定 */
      flex-shrink: 0; 
      overflow: hidden; 
      border-bottom: 2px solid #ccc; 
    }
    @media (min-width: 768px) {
      .board-container { height: auto; border-bottom: none; flex: 1; min-height: auto; }
    }
    .bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: opacity 0.5s ease; }

    /* カメラ機能：盤面だけをズーム・移動させ、メッセージや時計表示は固定 */
    .camera-world {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
      transform: translate(0, 0) scale(1);
      transition: transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: transform;
    }

    .camera-world .bg-image {
      transition: opacity 0.5s ease;
    }

    .time-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
      z-index: 40;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .turn-timer-bar-container {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 120px;
      height: 8px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 4px;
      overflow: hidden;
      z-index: 40;
      border: 1px solid rgba(255,255,255,0.6);
      display: none;
    }
    .turn-timer-bar {
      width: 100%;
      height: 100%;
      background: #ffeb3b;
      transform-origin: left;
      transition: transform 0.1s linear;
    }

    #message-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      z-index: 1000;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      border: 2px solid #1e88e5;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      width: 90%;
      max-width: 460px;
      line-height: 1.5;
    }
    .message-hidden {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.9);
      pointer-events: none;
    }
    .message-visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    .tile { 
      position: absolute; 
      width: 28px; 
      height: 28px; 
      border-radius: 50%; 
      border: 2px solid #333; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-weight: bold; 
      font-size: 8px; 
      color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3); 
      z-index: 2; 
      transform: translate(-50%, -50%); 
      cursor: pointer;
      transition: transform 0.2s;
    }
    @media (min-width: 768px) {
      .tile { width: 68px; height: 68px; font-size: 14px; border-width: 3px; }
    }
    .tile:hover { transform: translate(-50%, -50%) scale(1.15); z-index: 10; }

    .tile.tile-star {
      border-radius: 0;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }

    .tile.tile-start { background: #e53935 !important; color: white; font-size: 6px; }
    .tile.tile-goal { background: #1e88e5 !important; color: white; font-size: 7px; }
    .tile.team-red { background: #e53935; }
    .tile.team-blue { background: #1e88e5; }

    .kmyak-item {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: contain;
      cursor: pointer;
      z-index: 4000;
      border: 2px solid #ffeb3b;
      box-shadow: 0 0 10px rgba(255, 235, 59, 0.8);
      animation: kmyakPop 0.3s ease-out;
      transform: translate(-50%, -50%);
    }
    @media (min-width: 768px) {
      .kmyak-item { width: 72px; height: 72px; }
    }
    @keyframes kmyakPop {
      0% { transform: translate(-50%, -50%) scale(0); }
      80% { transform: translate(-50%, -50%) scale(1.1); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .goal-shake { animation: goalScreenShake 0.75s ease-in-out; }
    @keyframes goalScreenShake {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      10% { transform: translate(-8px, 4px) rotate(-0.8deg); }
      20% { transform: translate(8px, -4px) rotate(0.8deg); }
      30% { transform: translate(-7px, -5px) rotate(-0.7deg); }
      40% { transform: translate(7px, 5px) rotate(0.7deg); }
      50% { transform: translate(-5px, 3px) rotate(-0.5deg); }
      60% { transform: translate(5px, -3px) rotate(0.5deg); }
      70% { transform: translate(-3px, 2px) rotate(-0.3deg); }
      80% { transform: translate(3px, -2px) rotate(0.3deg); }
    }
    .goal-event-overlay {
      position: absolute; inset: 0; pointer-events: none; z-index: 1700;
      overflow: hidden; background: rgba(0,0,0,0.12);
    }
    .goal-spark {
      position: absolute; width: 7px; height: 7px; border-radius: 50%;
      animation: goalSpark 1.2s ease-out forwards;
    }
    @keyframes goalSpark {
      0% { opacity: 1; transform: translate(0,0) scale(1.5); }
      100% { opacity: 0; transform: translate(var(--gx),var(--gy)) scale(0.1); }
    }

    .special-effect-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5000;
      overflow: hidden;
    }
    .special-effect-overlay .effect-banner {
      position: absolute;
      z-index: 5001;
    }

    .firework-particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: explodeFirework 1s forwards ease-out;
    }
    @keyframes explodeFirework {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
    }

    .drone-light {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #00ffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ffff, 0 0 20px #ffffff;
      animation: droneMove 2.5s forwards ease-in-out;
    }
    @keyframes droneMove {
      0% { transform: translate(var(--startX), var(--startY)) scale(0.5); opacity: 0; }
      30% { opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translate(var(--targetX), var(--targetY)) scale(1.2); opacity: 0; }
    }

    .rain-banner, .sign-banner, .effect-banner, .return-banner, .win-banner, .allnight-banner, .jam-banner, .kmyak-result-banner {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
      z-index: 1750; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      pointer-events: none; animation: winPop 1.5s forwards ease-in-out; width: 90%; max-width: 440px; line-height: 1.5;
    }
    .rain-banner { background: rgba(30, 80, 140, 0.95); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 17px; font-weight: bold; border: 3px solid #87ceeb; }
    .rain-effect-overlay { z-index: 1700; background: linear-gradient(rgba(30,80,140,0.08), rgba(30,80,140,0.02)); }
    .rain-drop {
      position: absolute;
      width: 2px;
      height: 16px;
      background: rgba(190, 230, 255, 0.85);
      border-radius: 2px;
      transform: rotate(18deg);
      animation: rainFall 0.9s linear infinite;
    }
    @keyframes rainFall {
      0% { opacity: 0; transform: translate(0, -20px) rotate(18deg); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translate(-35px, 125vh) rotate(18deg); }
    }
    .sign-banner { background: rgba(220, 20, 100, 0.95); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 17px; font-weight: bold; border: 3px solid #ffeb3b; }
    .guts-banner { background: rgba(255, 140, 0, 0.96); color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 12px; font-weight: bold; border: 3px solid #fff; animation: gutsPop 1.8s forwards ease-out; width: 85%; max-width: 380px; line-height: 1.4; }
    .happy-banner { background: rgba(255, 70, 150, 0.96); color: #fff; padding: 14px 18px; border-radius: 16px; font-size: 17px; font-weight: bold; border: 3px solid #ffeb3b; animation: happyPop 1.8s forwards ease-out; }
    .guts-effect-overlay, .happy-effect-overlay { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:3200; }
    .fist-emoji, .happy-emoji { position:absolute; font-size:44px; animation: emojiBurst 1.6s ease-out forwards; }
    @keyframes gutsPop {
      0% { opacity:0; transform:translate(-50%,-50%) scale(0.4) rotate(-8deg); }
      20% { opacity:1; transform:translate(-50%,-50%) scale(1.15) rotate(4deg); }
      45% { transform:translate(-50%,-50%) scale(1) rotate(0); }
      100% { opacity:0; transform:translate(-50%,-50%) scale(0.9); }
    }
    @keyframes happyPop {
      0% { opacity:0; transform:translate(-50%,-50%) scale(0.4); }
      20% { opacity:1; transform:translate(-50%,-50%) scale(1.15); }
      50% { transform:translate(-50%,-50%) scale(1); }
      100% { opacity:0; transform:translate(-50%,-50%) scale(0.9); }
    }
    @keyframes emojiBurst {
      0% { opacity:0; transform:translate(0,0) scale(0.4) rotate(-20deg); }
      20% { opacity:1; }
      100% { opacity:0; transform:translate(var(--ex),var(--ey)) scale(1.15) rotate(25deg); }
    }
    .drone-effect-overlay { z-index:3200 !important; }
    .effect-banner { background: rgba(0, 0, 0, 0.85); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: bold; border: 2px solid #ffeb3b; animation: bannerPop 2s forwards ease-in-out; }
    @keyframes bannerPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      40% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    }
    .return-banner { background: rgba(230, 0, 18, 0.95); color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 16px; font-weight: bold; border: 2px solid #fff; animation: returnPop 1.5s forwards ease-in-out; }
    @keyframes returnPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      40% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    }
    .win-banner { background: rgba(0, 0, 0, 0.9); color: #fff; padding: 14px 20px; border-radius: 14px; font-size: 15px; font-weight: bold; border: 3px solid #ffeb3b; animation: winPop 0.5s forwards ease-out; max-width: 380px; }
    .win-celebration-overlay {
      position: absolute; inset: 0; pointer-events: none; z-index: 3200; overflow: hidden;
      background: radial-gradient(circle at center, rgba(255,255,255,0.18), transparent 62%);
    }
    .win-confetti {
      position: absolute; width: 8px; height: 15px; border-radius: 2px;
      animation: winConfettiFall 2.8s linear forwards;
      opacity: 0;
    }
    .win-star {
      position: absolute; font-size: 22px;
      animation: winStarBurst 1.8s ease-out forwards;
      opacity: 0;
    }
    .win-rays {
      position: absolute; left: 50%; top: 50%; width: 20px; height: 20px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(255,235,59,0.65);
      animation: winRays 1.4s ease-out forwards;
    }
    @keyframes winConfettiFall {
      0% { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(0.7); }
      100% { opacity: 0; transform: translateY(430px) rotate(720deg) scale(1); }
    }
    @keyframes winStarBurst {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(0deg); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--sx)), calc(-50% + var(--sy))) scale(1.5) rotate(180deg); }
    }
    @keyframes winRays {
      0% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.2); box-shadow: 0 0 0 0 rgba(255,235,59,0.75), 0 0 0 0 rgba(255,255,255,0.55); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(8); box-shadow: 0 0 0 22px rgba(255,235,59,0), 0 0 0 55px rgba(255,255,255,0); }
    }

    .allnight-banner { background: rgba(180, 0, 0, 0.95); color: #fff; padding: 14px 20px; border-radius: 12px; font-size: 15px; font-weight: bold; border: 3px solid #ffeb3b; }
    .jam-banner { background: rgba(50, 50, 50, 0.95); color: #fff; padding: 14px 20px; border-radius: 12px; font-size: 15px; font-weight: bold; border: 3px solid #ff9800; }
    .kmyak-result-banner { background: rgba(20, 40, 80, 0.95); color: #fff; padding: 14px 20px; border-radius: 12px; font-size: 17px; font-weight: bold; border: 3px solid #00bcd4; }

    @keyframes winPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes fireworksFlash {
      0% { opacity: 0.85; }
      100% { opacity: 0; }
    }
    @keyframes dronePulse {
      0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.35; }
      50% { transform: translate(-50%, -50%) scale(1.25); opacity: 0.8; }
    }

    .wrong-banner { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
      background: rgba(220, 20, 60, 0.95); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 15px; font-weight: bold; border: 2px solid #fff; 
      z-index: 3000; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.5); pointer-events: none; animation: wrongPop 0.8s forwards ease-in-out; width: 90%; max-width: 440px; line-height: 1.5;
    }
    @keyframes wrongPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      40% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    }

    .lottery-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(255, 255, 255, 0.95);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
      border-radius: 16px;
      width: 260px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 4px solid #1e88e5;
      animation: winPop 0.3s forwards ease-out;
      text-align: center;
    }
    @media (min-width: 768px) {
      .lottery-overlay { width: 360px; padding: 24px; }
    }
    .lottery-title { font-size: 11px; font-weight: bold; color: #333; margin-bottom: 6px; line-height: 1.3; }
    @media (min-width: 768px) { .lottery-title { font-size: 14px; } }
    .lottery-timer { font-size: 11px; color: #e60012; font-weight: bold; margin-bottom: 6px; }
    .lottery-cards { display: flex; flex-direction: row; justify-content: center; gap: 5px; width: 100%; }
    .lottery-card {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #fff;
      padding: 8px 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s, background 0.2s;
      border: 2px solid #fff;
      text-align: center;
      flex: 1;
    }
    @media (min-width: 768px) { .lottery-card { padding: 12px; font-size: 13px; } }
    .lottery-card:hover { transform: translateY(-3px) scale(1.02); }

    .quiz-countdown-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(88%, 360px);
      min-height: 150px;
      padding: 18px 14px;
      background: rgba(255,255,255,0.98);
      border: 4px solid #ff9800;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 4500;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .quiz-countdown-title {
      color: #e60012;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.45;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .quiz-countdown-number {
      font-size: 70px;
      line-height: 1;
      font-weight: 900;
      color: #ff9800;
      margin: 0;
      text-align: center;
      width: 100%;
      animation: quizCountdownPop 0.55s cubic-bezier(.2,1.5,.4,1);
      text-shadow: 0 3px 0 #fff, 0 5px 12px rgba(255,152,0,.45);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
    }
    .quiz-countdown-overlay.quiz-battle-start {
      animation: quizBattleFlash 0.8s ease-out;
      border-color: #e60012;
      box-shadow: 0 0 0 8px rgba(255,152,0,.18), 0 0 45px rgba(255,87,34,.8);
    }
    .quiz-countdown-overlay.quiz-battle-start .quiz-countdown-title {
      animation: none;
    }
    .quiz-battle-burst {
      position: absolute;
      inset: -20%;
      pointer-events: none;
      background: repeating-conic-gradient(from 0deg, rgba(255,152,0,0) 0deg 10deg, rgba(255,152,0,.35) 10deg 12deg);
      animation: quizBattleBurst .75s ease-out forwards;
    }
    .quiz-battle-vs {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 3;
      font-size: clamp(22px, 7vw, 32px);
      font-weight: 900;
      color: #e60012;
      opacity: 0;
      transform: translate(-50%, -50%) scale(.3);
      white-space: nowrap;
      text-shadow: 0 2px 0 #fff, 0 4px 10px rgba(0,0,0,.3);
      pointer-events: none;
    }

    @keyframes quizCountdownPop {
      0% { transform: translate(-50%, -50%) scale(1.65); opacity: 0; }
      65% { transform: translate(-50%, -50%) scale(.92); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    @keyframes quizBattleFlash {
      0% { transform: translate(-50%, -50%) scale(.82); filter: brightness(1); }
      35% { transform: translate(-50%, -50%) scale(1.06); filter: brightness(1.35); }
      100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
    }
    @keyframes quizBattleBurst {
      0% { transform: scale(.25) rotate(0deg); opacity: 0; }
      25% { opacity: 1; }
      100% { transform: scale(1.4) rotate(22deg); opacity: 0; }
    }

    .quiz-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(255, 255, 255, 0.98);
      z-index: 2500;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 14px;
      border-radius: 16px;
      width: 290px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 4px solid #ff9800;
      animation: winPop 0.3s forwards ease-out;
      text-align: center;
    }
    @media (min-width: 768px) {
      .quiz-overlay { width: 400px; padding: 24px; }
    }
    .quiz-title { font-size: 12px; font-weight: bold; color: #e60012; margin-bottom: 6px; }
    .quiz-timer { font-size: 11px; color: #333; font-weight: bold; margin-bottom: 6px; }
    .quiz-emojis { font-size: 20px; margin-bottom: 6px; letter-spacing: 2px; }
    .quiz-hint { font-size: 11px; color: #666; margin-bottom: 10px; font-weight: bold; background: #fff3e0; padding: 4px 8px; border-radius: 4px; }

    .kmyak-battle-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(20, 30, 50, 0.98);
      z-index: 2800;
      display: flex;
      flex-direction: column;
      justify-content: center;

    // 同一端末から同じ音が連続して送信された場合は、共有通知だけをまとめる。
    const lastPublished = lastSharedSoundPlayedAt[soundName] || 0;
    if (now - lastPublished < SHARED_SOUND_DEDUP_MS) return;
    lastSharedSoundPlayedAt[soundName] = now;
    const sound = {
      id: `${now}-${Math.random().toString(36).slice(2, 8)}`,
      name: soundName,
      createdAt: now
    };
    lastSharedSoundId = sound.id;
    update(ref(db, 'gameState/sharedSound'), sound);
  }

  // マス18の10%サプライズ演出：幻想的で感動的な上昇音。
  soundEffect.myak5Reveal = function() {
    const ctx = getAudioContext();
    const now = ctx.currentTime;
    const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = i < 3 ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(freq, now + i * 0.18);
      gain.gain.setValueAtTime(0.0001, now + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(i === notes.length - 1 ? 0.18 : 0.11, now + i * 0.18 + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.18 + 1.0);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.18);
      osc.stop(now + i * 0.18 + 1.05);
    });

    // 最後に余韻のある高音を重ねる。
    [1318.51, 1567.98].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + 1.15 + i * 0.08);
      gain.gain.setValueAtTime(0.0001, now + 1.15 + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.08, now + 1.22 + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.7);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + 1.15 + i * 0.08);
      osc.stop(now + 2.75);
    });
  };

  function spawnKmyakElements() {
    const board = document.getElementById('board');
    if (!board) return;

    // 既存のこみゃくを消してから、ボード中央の見える範囲に5体だけ配置。
    board.querySelectorAll('.kmyak-item').forEach(el => el.remove());

    const positions = [
      [24, 30], [50, 27], [76, 32], [35, 68], [66, 70]
    ];

    positions.forEach(([left, top], index) => {
      const img = document.createElement('img');
      img.src = 'kmyak.jpg';
      img.alt = `こみゃく${index + 1}`;
      img.dataset.itemId = String(index);
      img.className = 'kmyak-item';
      img.style.left = `${left}%`;
      img.style.top = `${top}%`;
      img.style.zIndex = '4000';
      img.style.pointerEvents = 'auto';

      img.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        if (!gameState.kmyakSpawnActive || gameState.kmyakSpawnResolved || img.dataset.tapped === '1') return;
        const itemId = img.dataset.itemId;
        const { ref, runTransaction, get, db } = window.dbRef;
        runTransaction(ref(db, `gameState/kmyakSpawnTappedItems/${itemId}`), current => current === null ? myTeamIndex : undefined)
          .then(result => {
            if (result.committed && result.snapshot.val() === myTeamIndex) {
              // こみゃくをタップできた瞬間に効果音を鳴らす。
              soundEffect.event();
              runTransaction(ref(db, `gameState/kmyakSpawnTaps/${myTeamIndex}`), current => (current || 0) + 1)
                .then(() => get(ref(db, 'gameState/kmyakSpawnTappedItems')).then(snap => {
                  const items = snap.val() || {};
                  if (Object.keys(items).length >= 5 && gameState.kmyakSpawnActive && !gameState.kmyakSpawnResolved) {
                    resolveKmyakSpawnEvent();
                  }
                }));
            }
          });
        img.dataset.tapped = '1';
        img.remove();
      });

      board.appendChild(img);
    });
  }

    const mt = gameState.mushroomTime;
    const remaining = Math.max(0, Number(mt.endAt || 0) - Date.now());
    const seconds = (remaining / 1000).toFixed(1);
    const taps = mt.taps || [0, 0, 0, 0];
    const counts = mt.participantCounts || [1, 1, 1, 1];
    const averages = taps.map((v, i) => counts[i] ? (Number(v) / Number(counts[i])) : 0);

    const button = overlay.querySelector('.mushroom-time-btn');
    button.disabled = remaining <= 0;
    overlay.querySelector('.mushroom-time-stats').innerHTML = teamNames.map((name, i) => `${name}：${Number(taps[i] || 0)}回 ÷ ${Number(counts[i] || 1)}人 = <b>${averages[i].toFixed(1)}</b>`).join('<br>');

  function pressMushroomTimeForCpu(teamIndex) {
    if (!gameState.activeMushroomTime || !gameState.mushroomTime || gameState.mushroomTime.status !== 'active') return;
    if (Date.now() >= Number(gameState.mushroomTime.endAt || 0)) return;
    const { ref, runTransaction, db } = window.dbRef;
    teamIndex = Number(teamIndex);
    if (!Number.isInteger(teamIndex) || teamIndex < 0 || teamIndex >= 4) return;
    runTransaction(ref(db, 'gameState'), current => {
      if (!current || !current.activeMushroomTime || !current.mushroomTime || current.mushroomTime.status !== 'active') return;
      if (Date.now() >= Number(current.mushroomTime.endAt || 0)) return;
      const mt = { ...current.mushroomTime };
      const taps = Array.isArray(mt.taps) ? [...mt.taps] : [0, 0, 0, 0];
      while (taps.length < 4) taps.push(0);
      taps[teamIndex] = (Number(taps[teamIndex]) || 0) + 1;
      mt.taps = taps;
      mt.lastTapAt = Date.now();
      return { ...current, mushroomTime: mt };
    });
  }

  window.pressMushroomTime = function() {
    if (!myUserName || isSpectator || mushroomTimeFinishing || !gameState.activeMushroomTime || !gameState.mushroomTime || gameState.mushroomTime.status !== 'active') return;
    if (Date.now() >= Number(gameState.mushroomTime.endAt || 0)) return;
    const { ref, runTransaction, db } = window.dbRef;
    const teamIndex = Number(myTeamIndex);
    if (!Number.isInteger(teamIndex) || teamIndex < 0 || teamIndex >= 4) return;

    // 得点はFirebase、演出はこの端末だけ。処理を完全に分離する。
    showMushroomBurst();

    // 🍄 ルート全体をトランザクション更新して、他端末のset()による
    // カウンター上書きを防ぐ。連打も1回ずつ確実に加算する。
    runTransaction(ref(db, 'gameState'), current => {
      if (!current || !current.activeMushroomTime || !current.mushroomTime) return;
      if (current.mushroomTime.status !== 'active') return;
      if (Date.now() >= Number(current.mushroomTime.endAt || 0)) return;
      const mt = { ...current.mushroomTime };
      const taps = Array.isArray(mt.taps) ? [...mt.taps] : [0, 0, 0, 0];
      while (taps.length < 4) taps.push(0);
      taps[teamIndex] = (Number(taps[teamIndex]) || 0) + 1;
      mt.taps = taps;
      mt.lastTapAt = Date.now();
      return { ...current, mushroomTime: mt };
    });
  };

  async function finishMushroomTime() {
    if (mushroomTimeFinishing) return;
    if (!gameState.activeMushroomTime || !gameState.mushroomTime || gameState.mushroomTime.status !== 'active') return;
    if (Date.now() < Number(gameState.mushroomTime.endAt || 0)) return;
    mushroomTimeFinishing = true;
    const { ref, runTransaction, db } = window.dbRef;
    await runTransaction(ref(db, 'gameState/mushroomTime'), current => {
      if (!current || current.status !== 'active') return;
      if (Date.now() < Number(current.endAt || 0)) return;
      const taps = current.taps || [0, 0, 0, 0];
      const counts = current.participantCounts || [1, 1, 1, 1];
      const averages = taps.map((v, i) => Number(v || 0) / Math.max(1, Number(counts[i] || 1)));
      const maxAverage = Math.max(...averages);
      const winners = averages.map((v, i) => Math.abs(v - maxAverage) < 0.000001 ? i : -1).filter(i => i >= 0);
      const losers = [0, 1, 2, 3].filter(i => !winners.includes(i));
      return {
        ...current,
        status: 'ended',
        result: {
          winners, losers, averages, taps, participantCounts: counts,
          message: winners.length > 1 ? `🍄 ${winners.map(i => teamNames[i]).join('・')} が同率優勝！` : `🍄 ${teamNames[winners[0]]} の勝利！`
        }
      };
    });
  }

  async function handleMushroomTimeSync() {
    const mt = gameState.mushroomTime;
    if (!mt || mt.status !== 'ended' || !mt.result || mt.resultApplied) return;
    if (mushroomTimeTurnAdvanceInProgress) return;
    mushroomTimeTurnAdvanceInProgress = true;
    removeMushroomTimeOverlay();

    const { ref, runTransaction, db } = window.dbRef;
    // 結果の適用と「ターンを進める権利」を1回だけ取得する。
    const claim = await runTransaction(ref(db, 'gameState/mushroomTime/resultApplied'), current => {
      if (current === true) return;
      return true;
    });
    if (!claim.committed) {
      mushroomTimeTurnAdvanceInProgress = false;
      return;
    }

    const losers = [...new Set((mt.result.losers || []).map(Number).filter(t => t >= 0 && t < 4))];
    const newPositions = [...gameState.positions];
    losers.forEach(t => { newPositions[t] = Math.max(0, Number(newPositions[t] || 0) - 1); });

    // 結果反映中はサイコロをロックしたままにする。
    gameState.positions = newPositions;
    gameState.activeMushroomTime = false;
    gameState.mushroomTime = { ...mt, resultApplied: true };
    gameState.mushroomTimeTurnLocked = true;
    syncGameState();
    updateBoardImage();
    soundEffect.goal();
    pushLog(`${mt.result.message}${losers.length ? ` → ${losers.map(t => teamNames[t]).join('・')} は1マス戻ります！` : ''}`);
    showScreenMessage(`${mt.result.message}<br><span style="font-size:11px;">${losers.length ? losers.map(t => `${teamNames[t]}：1マス戻る`).join('<br>') : '全チーム勝利！'}</span>`, 3000);
    await new Promise(r => setTimeout(r, 3000));
    losers.forEach(t => showSquareMessage(t, newPositions[t]));
    await new Promise(r => setTimeout(r, 1000));

    // この処理だけがターンを1回進める。元のサイコロ処理側では advanceTurn しない。
    gameState.activeMushroomTime = false;
    // ミャクニョッキ等と同様、次のチームへ移るまでロックを維持する。
    gameState.mushroomTimeTurnLocked = true;
    syncGameState();
    updateUI();
    isMoving = false;
    advanceTurn();
    gameState.mushroomTimeTurnLocked = false;
    syncGameState();
    scheduleCameraForNextTeam(50);
    mushroomTimeTurnAdvanceInProgress = false;
  }

  // CPU担当端末がイベント開始時にまだ確定していない場合でも、
  // Firebaseの更新をきっかけにCPU操作を確実に予約する。
  function scheduleMyakuNyokkiCpu() {
    if (!isCpuController() || !gameState.activeMyakuNyokki || !gameState.myakuNyokki) return;
    if (gameState.myakuNyokki.status !== 'active') return;

    myakuNyokkiCpuTimers.forEach(t => clearTimeout(t));
    myakuNyokkiCpuTimers = [];

    const startedAt = Number(gameState.myakuNyokki.startedAt || Date.now());
    const elapsed = Date.now() - startedAt;

    Object.entries(gameState.myakuNyokki.participants || {}).forEach(([key, p]) => {
      if (p.type !== 'cpu' || p.pressed) return;

      // イベント開始から0.9～3.2秒の間に押す。
      // 既に開始から時間が経っている場合は残り時間だけ待つ。
      const targetDelay = 900 + Math.floor(Math.random() * 2300);
      const delay = Math.max(100, targetDelay - Math.max(0, elapsed));
      myakuNyokkiCpuTimers.push(setTimeout(() => pressMyakuNyokkiForCpu(key), delay));
    });
  }

  // 5秒間、誰も「ミャク！」を押さなかった場合の処理。
  // 実プレイヤーが参加しているチームのうち、誰も押していないチームを1マス戻す。
  function scheduleMyakuNyokkiNoPressTimeout() {
    if (myakuNyokkiNoPressTimer) {
      clearTimeout(myakuNyokkiNoPressTimer);
      myakuNyokkiNoPressTimer = null;
    }
    if (!gameState.activeMyakuNyokki || !gameState.myakuNyokki) return;
    if (gameState.myakuNyokki.status !== 'active') return;

    const startedAt = Number(gameState.myakuNyokki.startedAt || Date.now());
    const endAt = Number(gameState.myakuNyokki.endAt || (startedAt + 5000));
    const delay = Math.max(250, endAt - Date.now());

    myakuNyokkiNoPressTimer = setTimeout(() => {
      myakuNyokkiNoPressTimer = null;
      finishMyakuNyokkiNoPress();
    }, delay);
  }

  async function finishMyakuNyokkiNoPress() {
    if (!gameState.activeMyakuNyokki || !gameState.myakuNyokki ||
        gameState.myakuNyokki.status !== 'active') return;

    const { ref, runTransaction, db } = window.dbRef;

    try {
      const result = await runTransaction(ref(db, 'gameState/myakuNyokki'), current => {
        if (!current || current.status !== 'active') return;
        const endAt = Number(current.endAt || (Number(current.startedAt || 0) + 5000));
        if (Date.now() < endAt) return;
        if (Number(current.count) > 0) return;

        const losingTeams = [];
        for (let t = 0; t < 4; t++) {
          const realPlayers = Object.values(current.participants || {})
            .filter(p => p.type === 'user' && Number(p.team) === t);
          if (realPlayers.length > 0 && realPlayers.some(p => !p.pressed)) {
            losingTeams.push(t);
          }
        }

        return {
          ...current,
          status: 'ended',
          noPressResolved: true,
          result: {
            type: 'no_press',
            teams: losingTeams,
            message: '⏰ 5秒間だれもニョッキしませんでした！'
          }
        };
      });
      if (!result.committed) return;
    } catch (err) {
      console.warn('ミャクニョッキ5秒タイムアウト処理に失敗しました。', err);
    }
  }

  async function pressMyakuNyokkiForCpu(participantKey) {
    if (!gameState.activeMyakuNyokki || !gameState.myakuNyokki || gameState.myakuNyokki.status !== 'active') return;
    const { ref, runTransaction, db } = window.dbRef;
    const now = Date.now();

    try {
      await runTransaction(ref(db, 'gameState/myakuNyokki'), current => {
      if (!current || current.status !== 'active') return;
      if (Date.now() >= Number(current.endAt || (Number(current.startedAt || 0) + 5000))) return;
      const p = (current.participants || {})[participantKey];
      if (!p || p.pressed) return;

      const nextCount = (Number(current.count) || 0) + 1;
      const next = { ...current, count: nextCount,
        lastPress: { participantKey, number: nextCount, timestamp: now, team: p.team, name: p.name } };
      next.participants = { ...(current.participants || {}) };
      next.participants[participantKey] = { ...p, pressed: true, number: nextCount, timestamp: now };

      if (current.lastPress && now - Number(current.lastPress.timestamp || 0) <= 200) {
        next.status = 'ended';
        next.result = {
          type: 'collision',
          teams: [...new Set([Number(current.lastPress.team), Number(p.team)])],
          message: `💥 かぶった！ ${current.lastPress.name} さんと ${p.name} さんがかぶりました！`
        };
      } else {
        const remaining = Object.values(next.participants).filter(x => !x.pressed).length;
        if (remaining <= 1) {
          const lastPlayer = Object.entries(next.participants).find(([, x]) => !x.pressed);
          next.status = 'ended';
          next.result = {
            type: 'last',
            teams: lastPlayer ? [Number(lastPlayer[1].team)] : [],
            message: lastPlayer ? `🌱 ${lastPlayer[1].name} さんが最後まで残りました！` : '🌱 ミャクニョッキ終了！'
          };
        }
      }
      return next;
      });
    } catch (err) {
      console.warn('ミャクニョッキCPU処理に失敗しました。', err);
      // 一時的な通信競合なら、CPU操作を一度だけ再予約する。
      if (gameState.activeMyakuNyokki && gameState.myakuNyokki?.status === 'active') {
        myakuNyokkiCpuTimers.push(setTimeout(() => pressMyakuNyokkiForCpu(participantKey), 350));
      }
    }
  }

  function calculateMovementTarget(oldPos, rawTargetPos, movingTeamIndex = gameState.currentTeamIndex) {
    let target = rawTargetPos;
    for (let step = oldPos + 1; step <= rawTargetPos; step++) {
      if (step === 5 && !gameState.lotteryTriggered) return 5;
      if (step === 10 && !gameState.quizTriggered) return 10;
      const teamAlreadyTriggered15 = Array.isArray(gameState.kmyakBattleTriggeredTeams)
        ? !!gameState.kmyakBattleTriggeredTeams[Number(movingTeamIndex)]
        : !!gameState.kmyakBattleTriggered;
      const triggered15Count = Array.isArray(gameState.kmyakBattleTriggeredTeams)
        ? gameState.kmyakBattleTriggeredTeams.filter(Boolean).length
        : (gameState.kmyakBattleTriggered ? 4 : 0);
      // 15マス目のイベントは、15マス目に最初に到着した3チームだけ。
      // 4番目のチームは15マス目で止まらず、そのまま通過する。
      if (step === 15 && !teamAlreadyTriggered15 && triggered15Count < 3) return 15;
    }
    return target;
  }

  window.initFirebaseSync = function() {
    const { ref, onValue, set, get, db } = window.dbRef;

    if (myUserName) {
      document.getElementById('login-modal').style.display = 'none';
      if (!isSpectator) registerUserToFirebase();
      else registerSpectatorToFirebase();
    } else {
      document.getElementById('login-modal').style.display = 'flex';
    }

    // 最終結果発表はgameStateとは別パスで共有し、他端末の古いgameState同期で
    // イベントが上書きされないようにする。
    onValue(ref(db, 'resultDisplayEvent'), (snapshot) => {
      const event = snapshot.val();
      if (!event || !event.id) return;

      const expiresAt = Number(event.expiresAt || 0);
      if (expiresAt && Date.now() >= expiresAt) return;
      if (event.id === lastResultDisplayEventId) return;

      lastResultDisplayEventId = event.id;
      const remaining = expiresAt
        ? Math.max(0, expiresAt - Date.now())
        : 5000;

      showWinBanner(
        event.teamName || '',
        event.membersStr || '',
        false,
        remaining
      );
    });

    try { liveTalkStartListeners(); } catch (e) {}

    onValue(ref(db, 'gameState'), (snapshot) => {
      const val = snapshot.val();
      if (val) {
        if (val.lotteryTriggered === undefined) val.lotteryTriggered = false;
        if (val.quizTriggered === undefined) val.quizTriggered = false;
        if (val.quizCountdownActive === undefined) val.quizCountdownActive = false;
        if (val.quizCountdown === undefined) val.quizCountdown = 3;
        if (val.quizBattleStartActive === undefined) val.quizBattleStartActive = false;
        if (val.quizRoundCountdownStarted === undefined) val.quizRoundCountdownStarted = false;
        // クイズ開始から2問終了まで、問題間もサイコロを完全ロックする。
        if (val.quizTurnLocked === undefined) val.quizTurnLocked = false;
        if (!Array.isArray(val.quizUsedIndices)) val.quizUsedIndices = [];
        if (val.quizRoundId === undefined) val.quizRoundId = 0;
        if (val.kmyakBattleTriggered === undefined) val.kmyakBattleTriggered = false;
        if (!Array.isArray(val.kmyakBattleTriggeredTeams)) val.kmyakBattleTriggeredTeams = [false, false, false, false];
        if (val.kmyakBattleTeamIndex === undefined) val.kmyakBattleTeamIndex = null;
        if (val.kmyakBattleResultRank === undefined) val.kmyakBattleResultRank = null;
        if (val.kmyakBattleResultOwner === undefined) val.kmyakBattleResultOwner = null;
        if (val.kmyakBattleRank4TeamIndex === undefined) val.kmyakBattleRank4TeamIndex = null;
        if (val.activeLottery === undefined) val.activeLottery = false;
        if (val.activeKmyakBattle === undefined) val.activeKmyakBattle = false;
        if (val.kmyakBattlePhase === undefined) val.kmyakBattlePhase = "idle";
        if (val.kmyakTaps === undefined) val.kmyakTaps = [0, 0, 0, 0];
        if (val.kmyakSpawnActive === undefined) val.kmyakSpawnActive = false;
        if (val.kmyakSpawnTaps === undefined) val.kmyakSpawnTaps = [0, 0, 0, 0];
        if (val.kmyakSpawnTappedItems === undefined) val.kmyakSpawnTappedItems = {};
        if (val.kmyakSpawnResolved === undefined) val.kmyakSpawnResolved = false;
        if (val.kmyakSpawnTriggered === undefined) val.kmyakSpawnTriggered = false;
        if (val.doubleDiceFlags === undefined) val.doubleDiceFlags = [false, false, false, false];
        if (val.activeMyakuNyokki === undefined) val.activeMyakuNyokki = false;
        if (val.myakuNyokki === undefined) val.myakuNyokki = null;
        if (val.myakuNyokkiTurnLocked === undefined) val.myakuNyokkiTurnLocked = false;
        if (val.turnActionLocked === undefined) val.turnActionLocked = false;
        if (val.turnActionLockedAt === undefined) val.turnActionLockedAt = 0;
        if (val.activeMushroomTime === undefined) val.activeMushroomTime = false;
        if (val.mushroomTime === undefined) val.mushroomTime = null;
        if (val.yoyakuEvent === undefined) val.yoyakuEvent = null;
        if (val.mushroomTimeTurnLocked === undefined) val.mushroomTimeTurnLocked = false;
        if (val.sharedCamera === undefined) val.sharedCamera = null;
        if (val.sharedSound === undefined) val.sharedSound = null;
        if (val.sharedMoveEvent === undefined) val.sharedMoveEvent = null;
        if (val.sharedDisplayEvent === undefined) val.sharedDisplayEvent = null;
        if (val.allNightActive === undefined) val.allNightActive = false;
        if (val.gameStarted === undefined) val.gameStarted = false;
        
        gameState = val;

        // 他端末の「移動イベント」を1回だけ受け取り、各端末で同じアニメーションを再生する。
        // 位置を1マスずつFirebaseから受け取る方式ではないため、10人以上でも通信量を抑えられる。
        if (gameState.sharedMoveEvent && gameState.sharedMoveEvent.id !== lastSharedMoveEventId) {
          const moveEvent = gameState.sharedMoveEvent;
          lastSharedMoveEventId = moveEvent.id;
          playSharedMoveEvent(moveEvent);
        }

        // 他端末のメッセージ・アナウンス表示も同じイベントとして再生する。
        if (gameState.sharedDisplayEvent && gameState.sharedDisplayEvent.id !== lastSharedDisplayEventId) {
          const displayEvent = gameState.sharedDisplayEvent;
          lastSharedDisplayEventId = displayEvent.id;
          applyingSharedDisplayEvent = true;
          try {
            if (displayEvent.type === 'screenMessage') {
              showScreenMessage(displayEvent.htmlContent, Number(displayEvent.duration) || 3000, false);
            } else if (displayEvent.type === 'squareMessage') {
              showSquareMessage(Number(displayEvent.teamIndex) || 0, Number(displayEvent.pos) || 0, false);
            } else if (displayEvent.type === 'myak5Reveal') {
              showMyak5Reveal(false);
            } else if (displayEvent.type === 'specialEffect') {
              const effectType = displayEvent.effectType;
              if (effectType === 'rain') {
                showRainEffectBanner(false);
              } else if (effectType === 'sign') {
                showSignBanner(false);
              } else if (effectType) {
                triggerSpecialEffect(effectType, false);
              }
            }
          } finally {
            applyingSharedDisplayEvent = false;
          }
        }

        // オールナイト万博の特別背景も全端末で同じ状態にする。
        applyAllNightBackground(!!gameState.allNightActive);

        // 他端末のカメラワークを同じタイミングで再生する。
        if (gameState.sharedCamera && gameState.sharedCamera.id !== lastSharedCameraId) {
          const cam = gameState.sharedCamera;
          lastSharedCameraId = cam.id;
          applyingSharedCamera = true;
          try {
            if (cam.mode === 'position') {
              focusCameraOnPosition(cam.pos, cam.zoom || 1.75, cam.duration || 900, false);
            } else if (cam.mode === 'team') {
              focusCameraOnTeam(cam.teamIndex, cam.zoom || 1.75, cam.duration || 900, false);
            } else if (cam.mode === 'reset') {
              resetCamera(cam.animate !== false, false);
            }
          } finally {
            applyingSharedCamera = false;
          }
        }

        // 他端末で鳴った効果音も同じイベントとして再生する。
        if (gameState.sharedSound && gameState.sharedSound.id !== lastSharedSoundId) {
          const snd = gameState.sharedSound;
          lastSharedSoundId = snd.id;
          if (snd.name && typeof soundEffect[snd.name] === 'function') {
            const now = Date.now();
            const lastPlayed = lastSharedSoundPlayedAt[snd.name] || 0;
            // 複数端末から同じ音が短時間に重複通知された場合は1回だけ再生。
            if (now - lastPlayed >= SHARED_SOUND_DEDUP_MS) {
              lastSharedSoundPlayedAt[snd.name] = now;
              applyingSharedSound = true;
              try { soundEffect[snd.name](); } finally { applyingSharedSound = false; }
            }
          }
        }
        
        if (gameState.activeLottery && !document.getElementById('lottery-overlay')) {
          // 5マス目に実際に到達したプレイヤー名を共有状態から復元する。
          // teamPlayers は表示用の配列とタイミングがずれることがあるため、
          // くじの対象者判定には gameState.lotteryTargetPlayerName を使う。
          const targetName = gameState.lotteryTargetPlayerName || getRealTeamPlayers(gameState.currentTeamIndex)[gameState.playerIndices[gameState.currentTeamIndex] || 0] || "プレイヤー";
          triggerLotteryEvent(gameState.currentTeamIndex, targetName, false);
        } else if (!gameState.activeLottery && document.getElementById('lottery-overlay')) {
          const board = document.getElementById('board');
          const overlay = board.querySelector('.lottery-overlay');
          if (overlay) overlay.remove();
          if (lotteryTimer) {
            clearInterval(lotteryTimer);
            lotteryTimer = null;
          }
        }

        if (gameState.quizCountdownActive) {
          showQuizCountdown(gameState.quizCountdown || 3);
        } else {
          const countdownOverlay = document.querySelector('.quiz-countdown-overlay');
          if (countdownOverlay) countdownOverlay.remove();
        }

        if (gameState.quizBattleStartActive) {
          showQuizBattleStartEffect();
        }

        const quizOverlayExists = !!document.getElementById('quiz-overlay');
        if (gameState.activeQuiz) {
          const incomingRoundId = Number(gameState.activeQuiz.roundId || gameState.activeQuiz.startTime || 0);
          const localRoundId = Number(activeQuiz && (activeQuiz.roundId || activeQuiz.startTime) || 0);
          if (!activeQuiz || localRoundId !== incomingRoundId || !quizOverlayExists) {
            activeQuiz = { ...gameState.activeQuiz };
            usedQuizIndices = Array.isArray(gameState.quizUsedIndices)
              ? [...gameState.quizUsedIndices]
              : (Array.isArray(activeQuiz.usedIndices) ? [...activeQuiz.usedIndices] : []);
            quizAnswerLocked = false;
            showQuizOverlay(activeQuiz);
            startQuizTimer(activeQuiz.startTime);
          }
        } else if (activeQuiz || quizOverlayExists) {
          if (quizTimer) {
            clearInterval(quizTimer);
            quizTimer = null;
          }
          activeQuiz = null;
          quizAnswerLocked = false;
          closeQuizOverlay();
        }

        if (gameState.activeKmyakBattle) {
          renderKmyakBattleOverlay();
          if (gameState.kmyakBattlePhase === "result") scheduleKmyakResultRecovery();
        } else {
          removeKmyakBattleOverlay();
        }

        if (gameState.activeMyakuNyokki) {
          renderMyakuNyokkiOverlay();
          scheduleMyakuNyokkiCpu();
          scheduleMyakuNyokkiNoPressTimeout();
        } else {
          removeMyakuNyokkiOverlay();
          if (myakuNyokkiNoPressTimer) {
            clearTimeout(myakuNyokkiNoPressTimer);
            myakuNyokkiNoPressTimer = null;
          }
        }
        handleMyakuNyokkiSync();

        handleYoyakuEventSync();

        if (gameState.activeMushroomTime && gameState.mushroomTime) {
          renderMushroomTimeOverlay();
          if (Date.now() >= Number(gameState.mushroomTime.endAt || 0)) finishMushroomTime();
        } else {
          removeMushroomTimeOverlay();
        }
        handleMushroomTimeSync();

        handleKmyakSpawnSync();

        updateUI();

        // 重要：
        // クイズを終了させた端末とCPU担当端末は別端末の場合がある。
        // そのため「クイズ終了時にその端末だけがCPUを再開する」のではなく、
        // Firebaseのゲーム状態を受信した全端末でCPUターンを再判定する。
        if (gameState.gameStarted && !gameState.isGameOver) {
          scheduleCpuTurn();
        }
      }
    });

    onValue(ref(db, 'users'), (snapshot) => {
      const val = snapshot.val();
      allUsers = val || {};

      // リロード時は onDisconnect により一瞬 users が空になることがある。
      // この瞬間にリセットするとゲーム進行まで最初に戻ってしまうため、
      // Firebase上のゲーム状態はそのまま保持して再接続する。

      if (!isSpectator && myUserName && !allUsers[encodeURIComponent(myUserName)]) {
        if (isLoggingOut) return;
        registerUserToFirebase();
        return;
      }

      if (myUserName && allUsers[encodeURIComponent(myUserName)]) {
        myTeamIndex = allUsers[encodeURIComponent(myUserName)].team;
        localStorage.setItem("expo_team", myTeamIndex);
      }

      rebuildTeamPlayers();

      // 参加者が退出した瞬間に、残ったプレイヤーまたはCPUへ担当を再評価。
      if (gameState.gameStarted && !gameState.isGameOver) {
        scheduleCpuTurn();
      }

      updateUI();
    });

    onValue(ref(db, 'spectators'), (snapshot) => {
      allSpectators = snapshot.val() || {};
      updateUI();
    });

    onValue(ref(db, 'logs'), (snapshot) => {
      const val = snapshot.val();
      if (val) {
        const logBox = document.getElementById('game-log');
        logBox.innerHTML = '';
        Object.values(val).reverse().forEach(item => {
          const div = document.createElement('div');
          div.innerText = item;
          logBox.appendChild(div);
        });
      }
    });

    onValue(ref(db, 'chats'), (snapshot) => {
      const val = snapshot.val();
      const chatMessages = document.getElementById('chat-messages');
      if (!chatMessages) return;

      // チャット入力中に、Firebaseの再同期でチャット欄全体を作り直さない。
      // 入力欄とは別DOMだが、スマホでは大量のDOM更新がキーボード入力を
      // 一時的に遅延させることがあるため、新規メッセージだけ追加する。
      if (!val) {
        chatMessages.replaceChildren();
        chatHistoryInitialized = true;
        return;
      }

      const entries = Object.entries(val).sort((a, b) => {
        return (a[1].timestamp || 0) - (b[1].timestamp || 0);
      });

      // 初回だけ履歴を一括表示。以後は未表示のメッセージだけ追加する。
      // これによりチャット入力中のDOM再構築を避ける。
      entries.forEach(([chatId, c]) => {
        if (seenChatIds.has(chatId)) return;
        const msgDiv = document.createElement('div');
        const teamColor = c.spectator ? '#777' : (teamColorsHex[c.team] || '#333');

        if (c.type === 'reaction') {
          msgDiv.innerHTML = `<span style="color:#888; font-size:9px;">[${c.time}]</span> <strong style="color:${teamColor};">${c.name}:</strong> リアクション <span style="font-size:14px;">${c.text}</span>`;
        } else {
          msgDiv.innerHTML = `<span style="color:#888; font-size:9px;">[${c.time}]</span> <strong style="color:${teamColor};">${c.name}:</strong> ${c.text}`;

          // クイズ中の判定は「新しく届いた回答」だけを対象にする。
          // Firebaseの再同期で、それまでの不正解回答がもう一度鳴るのを防ぐ。
          if (
            chatHistoryInitialized &&
            !quizAnswerLocked &&
            !quizProcessedChatIds.has(chatId) &&
            activeQuiz &&
            activeQuiz.active &&
            c.timestamp &&
            activeQuiz.startTime &&
            c.timestamp >= activeQuiz.startTime &&
            !c.spectator &&
            Number(c.team) >= 0 && Number(c.team) < 4
          ) {
            quizProcessedChatIds.add(chatId);
            if (activeQuiz.finalGoal && Number(c.team) !== Number(activeQuiz.targetTeam)) {
              // ゴール最終試練は、20マス目にぴったり止まったチームだけが回答できる。
            } else if (c.text.trim() === activeQuiz.answer) {
              handleQuizCorrect(c.team, c.name);
            } else if (activeQuiz.finalGoal) {
              // 最終問題は不正解でも終了しない。15秒間、何度でも挑戦できる。
              soundEffect.wrong();
              showWrongBanner(`${c.name}さんの回答「${c.text}」は不正解…！`);
              setTimeout(() => {
                const wrongBanner = document.querySelector('.wrong-banner');
                if (wrongBanner && activeQuiz && activeQuiz.finalGoal && activeQuiz.active) wrongBanner.remove();
              }, 900);
            } else {
              soundEffect.wrong();
              showWrongBanner(`${c.name}さんの回答「${c.text}」は不正解…！`);
            }
          }
        }

        chatMessages.appendChild(msgDiv);

        // 初回Firebase同期後に追加されたものだけ画面上へ流す
        if (chatHistoryInitialized && !seenChatIds.has(chatId)) {
          if (c.type === 'reaction') {
            showFloatingReaction(c.text);
          } else {
            showFloatingChat(c.name, c.text, teamColor);
          }
        }

        seenChatIds.add(chatId);
      });

      chatMessages.scrollTop = chatMessages.scrollHeight;
      chatHistoryInitialized = true;
    });

    // 参加者の在席情報を定期更新。
    refreshMyUserPresence();
    setInterval(refreshMyUserPresence, 60 * 1000);
    scheduleStaleUserCleanup();
  };

  function showFloatingReaction(emoji) {
    const board = document.getElementById('board');
    if (!board) return;
    const el = document.createElement('div');
    el.className = 'reaction-float';
    el.innerText = emoji;

    const randomX = 20 + Math.random() * 60;
    el.style.left = `${randomX}%`;

    board.appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }

  function showFloatingChat(name, text, teamColor) {
    const board = document.getElementById('board');
    if (!board) return;

    const el = document.createElement('div');
    el.className = 'chat-popup';

    const escapeHtml = (value) => String(value || '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch]));

    el.innerHTML = `<span style="color:${teamColor};">${escapeHtml(name)}</span>：${escapeHtml(text)}`;

    const randomX = 15 + Math.random() * 70;
    el.style.left = `${randomX}%`;

    board.appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }

  window.sendReaction = function(emoji) {
    // 🍄はキノコタイムの前後にチャットログへ流さない。
    // 13マス目到達後のキノコタイム中は得点＋専用演出だけ行い、
    // 終了処理～負けチームの1マス戻り完了までは完全に無効化する。
    // ゲーム終了後も🍄をチャット/Firebaseのchatsへ送らない。
    if (emoji === '🍄') {
      if (gameState.activeMushroomTime) {
        pressMushroomTime();
        return;
      }
      if (gameState.mushroomTimeTurnLocked || gameState.isGameOver) {
        return;
      }
    }
    if (!myUserName) {
      alert("参加してからリアクションを送ってください！");
      return;
    }
    const { ref, push, db } = window.dbRef;
    const now = new Date();
    const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    
    push(ref(db, 'chats'), {
      name: myUserName,
      team: myTeamIndex,
      text: emoji,
      type: 'reaction',
      time: timeStr,
      timestamp: Date.now()
    });
  };

  function handleKmyakSpawnSync() {
    const board = document.getElementById('board');
    if (!board) return;
    const existingKmyaks = board.querySelectorAll('.kmyak-item');

    if (gameState.kmyakSpawnActive && !gameState.kmyakSpawnResolved) {
      if (!kmyakSpawnRendered) {
        kmyakSpawnRendered = true;
        spawnKmyakElements();
      }
      const tappedItems = gameState.kmyakSpawnTappedItems || {};
      existingKmyaks.forEach(el => {
        if (Object.prototype.hasOwnProperty.call(tappedItems, el.dataset.itemId)) el.remove();
      });
    } else {
      existingKmyaks.forEach(el => el.remove());
      kmyakSpawnRendered = false;
    }
  }

  function scheduleCpuKmyakSpawnTaps() {
    cpuKmyakSpawnTimers.forEach(t => clearTimeout(t));
    cpuKmyakSpawnTimers = [];
    if (!isCpuController()) return;

    // CPU「ふつう」：こみゃくパニックでは少し遅れてランダムにタップする。
    for (let teamIndex = 0; teamIndex < 4; teamIndex++) {
      if (!isCpuTeam(teamIndex)) continue;
      const attempts = 1 + Math.floor(Math.random() * 3);
      for (let i = 0; i < attempts; i++) {
        const timer = setTimeout(() => {
          if (!gameState.kmyakSpawnActive || gameState.kmyakSpawnResolved) return;
          const available = [];
          for (let itemId = 0; itemId < 5; itemId++) {
            if (!Object.prototype.hasOwnProperty.call(gameState.kmyakSpawnTappedItems || {}, String(itemId))) {
              available.push(itemId);
            }
          }
          if (!available.length) return;
          const itemId = String(available[Math.floor(Math.random() * available.length)]);
          const { ref, runTransaction, db } = window.dbRef;
          runTransaction(ref(db, `gameState/kmyakSpawnTappedItems/${itemId}`), current => current === null ? teamIndex : undefined)
            .then(result => {
              if (!result.committed || result.snapshot.val() !== teamIndex) return;
              runTransaction(ref(db, `gameState/kmyakSpawnTaps/${teamIndex}`), current => (current || 0) + 1);
            });
        }, 2000 + Math.floor(Math.random() * 2500));
        cpuKmyakSpawnTimers.push(timer);
      }
    }
  }

  function triggerKmyakSpawnEvent() {
    if (gameState.kmyakSpawnActive || gameState.isGameOver) return;

    gameState.kmyakSpawnTriggered = true;
    gameState.kmyakSpawnActive = false;
    gameState.kmyakSpawnTargetTime = Date.now() + 5000;
    gameState.kmyakSpawnTaps = [0, 0, 0, 0];
    gameState.kmyakSpawnTappedItems = {};
    gameState.kmyakSpawnResolved = false;
    syncGameState();

    // 「こみゃくパニック！」の案内を表示してから、こみゃくを出現させる。
    soundEffect.event();
    showScreenMessage('😱 チーム戦！こみゃくパニック！<br><span style="font-size:13px;">すばやくタップしよう！</span>', 1800);
    setTimeout(() => {
      if (gameState.isGameOver || gameState.kmyakSpawnResolved) return;
      gameState.kmyakSpawnActive = true;
      gameState.kmyakSpawnTargetTime = Date.now() + 5000;
      syncGameState();
      spawnKmyakElements();
      soundEffect.quizStart();
      scheduleCpuKmyakSpawnTaps();
      checkKmyakSpawnTimer();
    }, 1800);
  }

  function checkKmyakSpawnTimer() {
    if (!gameState.kmyakSpawnTriggered || !gameState.kmyakSpawnActive || !gameState.kmyakSpawnTargetTime || gameState.kmyakSpawnResolved || gameState.isGameOver) return;
    if (Date.now() >= gameState.kmyakSpawnTargetTime) {
      resolveKmyakSpawnEvent();
    }
  }

  setInterval(() => {
    checkKmyakSpawnTimer();
  }, 200);

  async function resolveKmyakSpawnEvent() {
    cpuKmyakSpawnTimers.forEach(t => clearTimeout(t));
    cpuKmyakSpawnTimers = [];
    if (gameState.kmyakSpawnResolved) return;

    // 複数端末が同時に5秒終了を検知しても、終了処理とターン送りを
    // 1台だけが担当するようFirebaseトランザクションで確定する。
    if (!window.dbRef) return;
    const { ref, runTransaction, db } = window.dbRef;
    const claim = await runTransaction(ref(db, 'gameState/kmyakSpawnResolved'), current => {
      if (current === true) return;
      return true;
    }).catch(() => null);
    if (!claim || !claim.committed) return;

    gameState.kmyakSpawnResolved = true;
    gameState.kmyakSpawnActive = false;
    syncGameState();

    const taps = gameState.kmyakSpawnTaps || [0, 0, 0, 0];
    const maxTaps = Math.max(...taps);
    const winningTeams = maxTaps > 0 ? taps.reduce((arr, t, i) => {
      if (t === maxTaps) arr.push(i);
      return arr;
    }, []) : [];

    document.getElementById('board')?.querySelectorAll('.kmyak-item').forEach(el => el.remove());

    if (winningTeams.length > 0) {
      const winnerNamesStr = winningTeams.map(idx => teamNames[idx]).join('・');
      soundEffect.goal();
      pushLog(`🏆 こみゃくパニック終了！ ${winnerNamesStr} が一位（${maxTaps}タップ）！`);
      showScreenMessage(`🏆 こみゃくパニック結果！<br><span style="color:#ffeb3b; font-size:17px;">${winnerNamesStr}</span><br>が一位！`, 3000);

      // 一位以外のチームは1マス戻る。戻る動作の効果音も鳴らす。
      for (let i = 0; i < 4; i++) {
        if (winningTeams.includes(i)) continue;
        const oldPos = gameState.positions[i] || 0;
        const backTarget = Math.max(0, oldPos - 1);
        if (backTarget !== oldPos) {
          soundEffect.return();
          await movePieceStepByStep(i, oldPos, backTarget, true);
          gameState.positions[i] = backTarget;
          updateBoardImage();
          syncGameState();
        }
      }
      await waitForSquareMessage(2500);
    } else {
      soundEffect.wrong();
      pushLog('😢 こみゃくパニック終了！誰もタップしませんでした。');
      showScreenMessage('😢 こみゃくパニック終了<br>誰もタップしませんでした', 2500);
      await waitForSquareMessage(2500);
    }

    // このこみゃくパニックで現在のターンを1回だけ消化し、次のチームへ進める。
    // 先にadvanceTurn()することで、代理で振る場合も同じチームが連続して担当しない。
    gameState.kmyakSpawnTriggered = false;
    gameState.kmyakSpawnTargetTime = null;
    gameState.kmyakSpawnResolved = true;
    gameState.kmyakSpawnActive = false;
    isMoving = false;
    advanceTurn();
    scheduleCameraForNextTeam(50);
  }

  function registerUserToFirebase() {
    if (!myUserName || isSpectator) return;
    const { ref, set, get, runTransaction, onDisconnect, db } = window.dbRef;
    const encodedName = encodeURIComponent(myUserName);
    const userRef = ref(db, `users/${encodedName}`);
    const teamRef = ref(db, `teamAssignments/${encodedName}`);

    // 明示的に「退出」を押さずに閉じた場合も参加者一覧から自動削除する。
    // チーム情報は users とは別に保存するため、ここで削除されない。
    onDisconnect(userRef).remove();

    // チーム決定ルートはここだけ。
    // teamAssignments に既存のチームがあれば必ずそれを使用し、
    // リロード・再接続では絶対に再抽選しない。
    runTransaction(teamRef, (current) => {
      if (current && current.team >= 0 && current.team < 4) return current;

      let counts = [0, 0, 0, 0];
      Object.values(allUsers).forEach(u => {
        if (u.team >= 0 && u.team < 4) counts[u.team]++;
      });
      let minVal = Math.min(...counts);
      let candidateTeams = [];
      counts.forEach((cnt, idx) => {
        if (cnt === minVal) candidateTeams.push(idx);
      });
      const assignedTeam = candidateTeams[Math.floor(Math.random() * candidateTeams.length)];
      return { team: assignedTeam };
    }).then((result) => {
      if (!myUserName || isSpectator || !result.committed) return;

      const assignedTeam = result.snapshot.val().team;
      myTeamIndex = assignedTeam;
      localStorage.setItem("expo_team", myTeamIndex);

      return set(userRef, {
        name: myUserName,
        team: myTeamIndex,
        lastActive: Date.now(),
        role: 'participant'
      });
    }).catch(err => {
      console.warn('参加者登録に失敗しました。', err);
    });
  }

  function scheduleStaleUserCleanup() {
    if (staleUserCleanupTimer) clearTimeout(staleUserCleanupTimer);
    staleUserCleanupTimer = setTimeout(async () => {
      staleUserCleanupTimer = null;
      if (!window.dbRef) {
        scheduleStaleUserCleanup();
        return;
      }

      const { ref, get, update, db } = window.dbRef;
      try {
        const snapshot = await get(ref(db, 'users'));
        const users = snapshot.val() || {};
        const now = Date.now();
        const updates = {};

        Object.entries(users).forEach(([key, u]) => {
          const lastActive = Number(u && u.lastActive || 0);
          if (lastActive > 0 && now - lastActive > 30 * 60 * 1000) {
            updates[`users/${key}`] = null;
          }
        });

        if (Object.keys(updates).length) await update(ref(db), updates);
      } catch (err) {
        console.warn('古い参加者の整理に失敗しました。', err);
      }

      scheduleStaleUserCleanup();
    }, 5 * 60 * 1000);
  }

  function isMyTurn() {
    if (isSpectator) return false;
    if (!gameState.gameStarted || gameState.isGameOver || activeQuiz || gameState.activeQuiz || gameState.quizTurnLocked || gameState.quizCountdownActive || gameState.quizRoundCountdownStarted || gameState.activeLottery || gameState.activeKmyakBattle || gameState.activeMyakuNyokki) return false;
    
    if (Date.now() - lastRollTime < 3000) return false;

    const currentTeam = gameState.currentTeamIndex;
    const currentTeamPos = gameState.positions[currentTeam];
    
    if (currentTeamPos === 5 && !gameState.lotteryTriggered) return false;
    if (currentTeamPos === 10 && !gameState.quizTriggered) return false;
    const current15Triggered = Array.isArray(gameState.kmyakBattleTriggeredTeams)
      ? !!gameState.kmyakBattleTriggeredTeams[currentTeam]
      : !!gameState.kmyakBattleTriggered;
    if (currentTeamPos === 15 && !current15Triggered && (Array.isArray(gameState.kmyakBattleTriggeredTeams) ? gameState.kmyakBattleTriggeredTeams.filter(Boolean).length < 3 : !gameState.kmyakBattleTriggered)) return false;

    if (myTeamIndex !== gameState.currentTeamIndex) return false;
    
    const list = getRealTeamPlayers(myTeamIndex);
    if (!list || list.length === 0) return false;
    
    const currentPIdx = gameState.playerIndices[myTeamIndex] || 0;
    const currentTurnPlayerName = list[currentPIdx % list.length];
    
    return myUserName === currentTurnPlayerName;
  }

  function calculateTilePositions() {
    const board = document.getElementById('board');
    if (!board) return;
    const width = board.clientWidth || 340;
    const height = board.clientHeight || 340;
    const isMobile = window.innerWidth < 768;
    const margin = isMobile ? 18 : 50;
    const rx = (width / 2) - margin;
    const ry = (height / 2) - margin;
    const cx = width / 2;
    const cy = height / 2;

    tilePositions = [];
    for (let i = 0; i < totalTiles; i++) {
      const angle = (i / totalTiles) * 2 * Math.PI - Math.PI / 2;
      const x = cx + rx * Math.cos(angle);
      const y = cy + ry * Math.sin(angle);
      tilePositions.push({ x, y });
    }
  }

  function setupBoard() {
    const board = document.getElementById('board');
    calculateTilePositions();

    // 盤面の背景・マス・コマをカメラ用レイヤーにまとめる
    // （時計・メッセージ・各種イベント表示は従来どおり固定）
    let cameraWorld = document.getElementById('camera-world');
    if (!cameraWorld) {
      cameraWorld = document.createElement('div');
      cameraWorld.id = 'camera-world';
      cameraWorld.className = 'camera-world';
      const bgImage = document.getElementById('bg-image');
      board.insertBefore(cameraWorld, bgImage);
      cameraWorld.appendChild(bgImage);
    }

    for (let i = 0; i < totalTiles; i++) {
      const tile = document.createElement('div');
      tile.id = `tile-${i}`;
      
      let colorClass = "";
      if (i === 0) colorClass = "tile-start";
      else if (i === totalTiles - 1) colorClass = "tile-goal";
      else colorClass = (i % 2 === 0) ? "team-red" : "team-blue";

      if (i === 5 || i === 10 || i === 15) {
        colorClass += " tile-star";
      }

      tile.className = `tile ${colorClass}`;
      tile.style.left = `${tilePositions[i].x}px`;
      tile.style.top = `${tilePositions[i].y}px`;
      tile.innerText = i === 0 ? 'START' : i === totalTiles - 1 ? 'GOAL' : i;
      
      tile.onclick = () => {
        if (tileEvents[i].effect) {
          triggerSpecialEffect(tileEvents[i].effect);
        }
      };
      cameraWorld.appendChild(tile);
    }

    teams.forEach((team, index) => {
      const piece = document.createElement('img');
      piece.id = `piece-${index}`;
      piece.className = `piece piece-team-${index}`;
      piece.src = pieceImages[index];
      piece.alt = teamNames[index];
      piece.onerror = function() {
        this.style.display = 'none';
      };
      cameraWorld.appendChild(piece);
    });

    resetCamera(false);
    updateUI();
  }

  function applyCameraTransform(x, y, zoom, duration = 900) {
    const board = document.getElementById('board');
    const world = document.getElementById('camera-world');
    if (!board || !world) return;

    const width = board.clientWidth || 340;
    const height = board.clientHeight || 340;
    const scale = Math.max(1, zoom);

    // 指定位置が画面中央に来るように移動し、盤面外の余白が出ない範囲に制限
    let tx = width / 2 - x * scale;
    let ty = height / 2 - y * scale;
    const minTx = width - width * scale;
    const minTy = height - height * scale;
    tx = Math.min(0, Math.max(minTx, tx));
    ty = Math.min(0, Math.max(minTy, ty));

    world.style.transitionDuration = `${duration}ms`;
    world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    cameraZoom = scale;
  }

  function focusCameraOnPosition(pos, zoom = 1.75, duration = 900, sync = true) {
    const targetTile = tilePositions[pos];
    if (!targetTile) return;
    cameraFocusedTeam = null;
    applyCameraTransform(targetTile.x, targetTile.y, zoom, duration);
    if (sync && !applyingSharedCamera && window.dbRef) publishSharedCamera({ mode: 'position', pos, zoom, duration });
  }

  function focusCameraOnTeam(teamIndex, zoom = 1.75, duration = 900, sync = true) {
    if (teamIndex == null || !gameState.positions) return;
    const pos = gameState.positions[teamIndex];
    const targetTile = tilePositions[pos];
    if (!targetTile) return;
    cameraFocusedTeam = teamIndex;
    applyCameraTransform(targetTile.x, targetTile.y, zoom, duration);
    if (sync && !applyingSharedCamera && window.dbRef) publishSharedCamera({ mode: 'team', teamIndex, zoom, duration });
  }

  function resetCamera(animate = true, sync = true) {
    const world = document.getElementById('camera-world');
    if (!world) return;
    if (cameraResetTimer) {
      clearTimeout(cameraResetTimer);
      cameraResetTimer = null;
    }
    world.style.transitionDuration = animate ? '1200ms' : '0ms';
    world.style.transform = 'translate(0, 0) scale(1)';
    cameraZoom = 1;
    cameraFocusedTeam = null;
    if (sync && !applyingSharedCamera && window.dbRef) publishSharedCamera({ mode: 'reset', animate });
  }

  function publishSharedCamera(command) {
    if (!window.dbRef) return;
    const { ref, update, db } = window.dbRef;
    const now = Date.now();
    const camera = { ...command, id: `${now}-${Math.random().toString(36).slice(2, 8)}`, createdAt: now };

    update(ref(db, 'gameState/sharedCamera'), camera);
  }

  function scheduleCameraForNextTeam(delay = 0) {

  function waitForSquareMessage(duration = 3000) {

  let boardImageUpdateTimer = null;
  let boardImageUpdateToken = 0;

  function updateBoardImage() {
    const maxPos = Math.max(...gameState.positions);
    const badge = document.getElementById('time-badge');
    const bgImage = document.getElementById('bg-image');
    if (!bgImage) return;

    let nextSrc;
    let nextBadge;
    if (maxPos <= 4) {
      nextBadge = "⏰ 現在の時間: 朝 (09:00 - 11:00)";
      nextSrc = "banpaku.jpg";
    } else if (maxPos >= 5 && maxPos <= 11) {
      nextBadge = "⏰ 現在の時間: 昼 (11:00 - 15:45)";
      nextSrc = "banpaku2.jpg";
    } else if (maxPos >= 12 && maxPos <= 15) {
      nextBadge = "⏰ 現在の時間: 夕方 (15:45 - 18:45)";
      nextSrc = "banpaku3.jpg";
    } else {
      nextBadge = "⏰ 現在の時間: 夜 (19:30 - 22:00)";
      nextSrc = "banpaku4.jpg";
    }

    // 移動中に古い背景変更が後から適用されないようにする。
    // 背景を一度透明にする処理は白く光って見えるため行わず、即時に切り替える。
    if (boardImageUpdateTimer) clearTimeout(boardImageUpdateTimer);
    boardImageUpdateToken++;
    if (!bgImage.src.endsWith(nextSrc)) bgImage.src = nextSrc;
    if (badge) badge.innerText = nextBadge;
    bgImage.style.opacity = '0.8';
  }

  function publishSharedDisplayEvent(event) {
    if (applyingSharedDisplayEvent || !window.dbRef) return null;
    const { ref, update, db } = window.dbRef;
    const now = Date.now();
    const displayEvent = {
      id: `${now}-${Math.random().toString(36).slice(2, 8)}`,
      createdAt: now,
      ...event
    };

  function finishYoyakuAttempt() {
    const ev = gameState.yoyakuEvent;
    if (!ev || ev.status !== 'active') return;
    const displayUntil = Number(ev.displayUntil || (Number(ev.startedAt || 0) + 3000));
    if (Date.now() < displayUntil) {
      setTimeout(() => finishYoyakuAttempt(), Math.max(50, displayUntil - Date.now()));
      return;

    const { ref, runTransaction, db } = window.dbRef;
    runTransaction(ref(db, 'gameState/yoyakuEvent'), current => {
      if (!current || current.status !== 'active') return;
      // 0.5秒以内のタップ結果を、yoyaku.jpgを3秒表示した後に確定する。
      return { ...current, status: 'resolved', result: current.result === 'success' ? 'success' : 'fail' };
    }).catch(() => {});

  async function handleYoyakuEventSync() {
    const ev = gameState.yoyakuEvent;
    if (!ev || ev.resultApplied) {
      // イベント終了後は、結果画面を再生成しない。
      removeYoyakuEventOverlay();
      return;
    }

    renderYoyakuEventOverlay();

    if (ev.status === 'active') {
      const displayUntil = Number(ev.displayUntil || (Number(ev.startedAt || 0) + 3000));
      if (Date.now() >= displayUntil) {
        finishYoyakuAttempt();
      } else {
        setTimeout(() => {
          if (gameState.yoyakuEvent && gameState.yoyakuEvent.status === 'active') finishYoyakuAttempt();
        }, Math.max(50, displayUntil - Date.now()));
      }
      return;
    }
    if (ev.resultApplied) return;

    const { ref, runTransaction, db } = window.dbRef;
    // 結果表示中に他端末が二重処理しないよう、処理担当だけを1台に確定。
    // resultApplied は「結果表示終了」のフラグなので、ここでは変更しない。
    const claim = await runTransaction(ref(db, 'gameState/yoyakuEvent/resultClaimed'), current => {
      if (current === true) return;
      return true;
    }).catch(() => null);
    if (!claim || !claim.committed) return;

    const teamIndex = Number(ev.teamIndex);
    const success = ev.result === 'success';
    if (success) {
      soundEffect.yoyakuSuccess();
    } else {
      soundEffect.yoyakuFail();
    }
    const oldPos = Number(gameState.positions[teamIndex] || 0);
    const newPos = success ? Math.min(totalTiles - 1, oldPos + 2) : oldPos;

    if (success) {
      await movePieceStepByStep(teamIndex, oldPos, newPos, false);
      gameState.positions[teamIndex] = newPos;
      syncGameState();
      updateBoardImage();
    }

    // 結果発表は2秒だけ表示し、その後は必ず画面から消す。
    await new Promise(r => setTimeout(r, 2000));

    // まずローカル画面を即時消去。遅れて届くFirebase更新でも再表示されないようにする。
    removeYoyakuEventOverlay();
    hideBoardMessage();

    // yoyakuEventだけをFirebaseから確実に削除する。
    // gameState全体を書き戻す方式だけにすると、別端末の古い状態で結果画面が復活する可能性がある。
    gameState.yoyakuEvent = null;
    gameState.turnActionLocked = true;
    try {
      await new Promise(resolve => {
        const timer = setTimeout(resolve, 1000);
        set(ref(db, 'gameState/yoyakuEvent'), null).finally(() => {
          clearTimeout(timer);
          resolve();
        });
      });
    } catch (e) {}

    // 結果表示に関するDOMを念のためもう一度完全消去。
    removeYoyakuEventOverlay();
    hideBoardMessage();
    updateUI();

    // イベント終了後にだけ次のチームへ進む。
    isMoving = false;
    advanceTurn();
    scheduleCameraForNextTeam(50);
  }
