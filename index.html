  async function startKmyakBattleEvent(teamIndex = gameState.currentTeamIndex) {
    if (isSpectator) return;
    // 多人数接続時、各端末が同時に15マス目を検知して別々のイベントIDを作ると、
    // 結果処理が競合してイベント後にゲームが止まることがある。
    // Firebaseのトランザクションで「開始権」を1端末だけ取得してからイベントを開始する。
    const { ref, runTransaction, db } = window.dbRef;
    const eventId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    const claim = await runTransaction(ref(db, 'gameState'), current => {
      if (!current || current.activeKmyakBattle || current.kmyakBattlePhase === 'countdown' || current.kmyakBattlePhase === 'battle' || current.kmyakBattlePhase === 'result') return;
      return {
        ...current,
        activeKmyakBattle: true,
        kmyakBattleEventId: eventId,
        kmyakBattleResolved: false,
        kmyakBattleTeamIndex: Number(teamIndex),
        kmyakBattlePhase: 'countdown',
        kmyakBattleCountdown: 3,
        kmyakBattleTimer: 5,
        kmyakTaps: [0, 0, 0, 0]
      };
    }).catch(() => null);
    if (!claim || !claim.committed) return;

    gameState = claim.snapshot.val() || gameState;
    soundEffect.event();
    pushLog(`🏃‍♂️ 【大混雑脱出連打ゲーム 開始！】ボタン連打バトルが始まります！`);
    runKmyakBattleSequence();
  }

  function runKmyakBattleSequence() {
    const { ref, runTransaction, db } = window.dbRef;
    const eventId = String(gameState.kmyakBattleEventId || '');
    if (!eventId) return;

    let cd = 3;
    const cdInterval = setInterval(() => {
      cd--;
      if (cd > 0) {
        // 別端末が結果確定した後に、古いカウントダウンがFirebaseへ
        // 戻ってしまわないよう、イベントIDとphaseをサーバー側でも確認する。
        runTransaction(ref(db, 'gameState'), current => {
          if (!current || String(current.kmyakBattleEventId || '') !== eventId ||
              !current.activeKmyakBattle || current.kmyakBattlePhase !== 'countdown') return;
          current.kmyakBattleCountdown = cd;
          return current;
        }).catch(() => {});
      } else {
        clearInterval(cdInterval);
        runTransaction(ref(db, 'gameState'), current => {
          if (!current || String(current.kmyakBattleEventId || '') !== eventId ||
              !current.activeKmyakBattle || current.kmyakBattlePhase !== 'countdown') return;
          current.kmyakBattlePhase = 'battle';
          current.kmyakBattleTimer = 5;
          return current;
        }).then(result => {
          if (!result || !result.committed) return;
          // 結果表示に移っていた場合、この端末の古いタイマーはここで終了。
          if (String(gameState.kmyakBattleEventId || '') !== eventId ||
              !gameState.activeKmyakBattle || gameState.kmyakBattlePhase !== 'battle') return;

          soundEffect.event();
          scheduleCpuKmyakTaps();

          let timer = 5;
          const battleInterval = setInterval(() => {
            // 他端末が結果処理を確定したら、古いタイマーは一切Firebaseへ書かない。
            if (String(gameState.kmyakBattleEventId || '') !== eventId ||
                !gameState.activeKmyakBattle || gameState.kmyakBattlePhase !== 'battle') {
              clearInterval(battleInterval);
              return;
            }

            timer--;
            if (timer > 0) {
              runTransaction(ref(db, 'gameState'), current => {
                if (!current || String(current.kmyakBattleEventId || '') !== eventId ||
                    !current.activeKmyakBattle || current.kmyakBattlePhase !== 'battle') return;
                current.kmyakBattleTimer = timer;
                return current;
              }).catch(() => {});
            } else {
              clearInterval(battleInterval);
              resolveKmyakBattleHost();
            }
          }, 1000);
        }).catch(() => {});
      }
    }, 1000);
  }

  function scheduleCpuKmyakTaps() {
    cpuKmyakTapTimers.forEach(t => clearInterval(t));
    cpuKmyakTapTimers = [];
    if (!isCpuController()) return;

    for (let teamIndex = 0; teamIndex < 4; teamIndex++) {
      if (!isCpuTeam(teamIndex)) continue;
      // CPU「ふつう」：人間より少し控えめなペースで連打。
      const intervalMs = 280 + Math.floor(Math.random() * 220);
      const timer = setInterval(() => {
        if (!gameState.activeKmyakBattle || gameState.kmyakBattlePhase !== "battle") {
          clearInterval(timer);
          return;
        }
        const { ref, runTransaction, db } = window.dbRef;
        runTransaction(ref(db, `gameState/kmyakTaps/${teamIndex}`), current => (current || 0) + 1);
      }, intervalMs);
      cpuKmyakTapTimers.push(timer);
    }
  }

  function handleKmyakTap() {
    if (!gameState.activeKmyakBattle || gameState.kmyakBattlePhase !== "battle") return;
    soundEffect.step();
    
    const { ref, runTransaction, db } = window.dbRef;
    runTransaction(ref(db, `gameState/kmyakTaps/${myTeamIndex}`), (currentVal) => {
      return (currentVal || 0) + 1;
    });
  }

  async function resolveKmyakBattleHost() {
    cpuKmyakTapTimers.forEach(t => clearInterval(t));
    cpuKmyakTapTimers = [];

    const eventId = String(gameState.kmyakBattleEventId || "");
    if (!eventId) return;

    // 同じイベントの結果処理を1端末だけが担当する。
    // これがないと、多人数接続時に複数端末が同時に advanceTurn() を実行し、
    // 結果表示の再発生やターンの二重送りが起こる。
    const { ref, runTransaction, db } = window.dbRef;
    const claim = await runTransaction(ref(db, `gameState/kmyakBattleResolveClaims/${eventId}`), current => {
      if (current) return;
      return { resolvedAt: Date.now() };
    }).catch(() => null);
    if (!claim || !claim.committed) return;

    const eventTeamIndex = Number(gameState.kmyakBattleTeamIndex);
    if (!Number.isInteger(eventTeamIndex) || eventTeamIndex < 0 || eventTeamIndex > 3) return;

    let averages = [0, 0, 0, 0];
    for (let i = 0; i < 4; i++) {
      const totalTaps = Number(gameState.kmyakTaps?.[i] || 0);
      const memberCount = Math.max(1, teamPlayers[i].filter(name => !name.includes("募集中")).length);
      averages[i] = totalTaps / memberCount;
    }

    // 連打数（1人あたり平均）を順位化。完全同率の場合はチーム番号で決める。
    const ranking = [0, 1, 2, 3].sort((a, b) => {
      if (averages[b] !== averages[a]) return averages[b] - averages[a];
      return a - b;
    });
    const rank = ranking.indexOf(eventTeamIndex) + 1;

    gameState.kmyakBattlePhase = "result";
    gameState.kmyakBattleResultRank = rank;
    gameState.kmyakBattleResultOwner = eventTeamIndex;
    gameState.kmyakBattleRank4TeamIndex = ranking[3];
    gameState.kmyakBattleResolved = true;
    syncGameState();

    const teamName = teamNames[eventTeamIndex];
    if (rank === 1) {
      soundEffect.goal();
      pushLog(`🏃‍♂️ 大混雑脱出連打ゲーム結果：${teamName} は連打バトル1位！大混雑を抜け出すことに成功。2マス進む。`);
    } else if (rank === 4) {
      soundEffect.wrong();
      pushLog(`🏃‍♂️ 大混雑脱出連打ゲーム結果：${teamName} は4位。大混雑を抜け出せなかった。2マス戻る。`);
    } else {
      pushLog(`🏃‍♂️ 大混雑脱出連打ゲーム結果：${teamName} は${rank}位。今回はそのままです。`);
    }

    setTimeout(async () => {
      // 結果処理は「イベント終了＋位置更新＋次チームへの交代」を
      // Firebaseの1回のトランザクションで確定する。
      // これにより、10人以上の端末から古いgameStateが戻ってきても
      // 結果表示の再発生や、同じチームでターンが止まることを防ぐ。
      if (String(gameState.kmyakBattleEventId || "") !== eventId) return;

      const oldPos = Number(gameState.positions[eventTeamIndex] || 0);
      const goalIndex = totalTiles - 1;
      const rank4TeamIndex = rank === 4 ? Number(gameState.kmyakBattleRank4TeamIndex) : eventTeamIndex;
      const moveOldPos = Number(gameState.positions[rank4TeamIndex] || 0);
      const forwardTarget = rank === 1 ? Math.min(goalIndex, oldPos + 2) : oldPos;
      const backTarget = rank === 4 ? Math.max(0, moveOldPos - 2) : oldPos;
      const { ref, runTransaction, db } = window.dbRef;

      // 移動アニメーションを先に共有。ゲーム状態そのものは下のトランザクションで確定する。
      if (rank === 1 && forwardTarget > oldPos) {
        publishSharedMoveEvent(eventTeamIndex, oldPos, forwardTarget, false);
      } else if (rank === 4 && backTarget < moveOldPos) {
        publishSharedMoveEvent(rank4TeamIndex, moveOldPos, backTarget, true);
      }

      const finalize = await runTransaction(ref(db, 'gameState'), current => {
        if (!current) return;
        if (String(current.kmyakBattleEventId || '') !== eventId) return;
        if (!current.activeKmyakBattle || current.kmyakBattlePhase !== 'result') return;

        const currentTeam = Number(current.currentTeamIndex);
        const players = getRealTeamPlayers(currentTeam);
        const playerIndices = Array.isArray(current.playerIndices) ? [...current.playerIndices] : [0,0,0,0];
        if (players.length > 0) {
          playerIndices[currentTeam] = (Number(playerIndices[currentTeam] || 0) + 1) % players.length;
        } else {
          playerIndices[currentTeam] = 0;
        }

        const positions = Array.isArray(current.positions) ? [...current.positions] : [0,0,0,0];
        if (rank === 1) positions[eventTeamIndex] = forwardTarget;
        else if (rank === 4) {
          const rank4TeamIndex = Number(current.kmyakBattleRank4TeamIndex);
          if (Number.isInteger(rank4TeamIndex) && rank4TeamIndex >= 0 && rank4TeamIndex < 4) {
            positions[rank4TeamIndex] = Math.max(0, Number(positions[rank4TeamIndex] || 0) - 2);
          }
        }

        const skipTurns = Array.isArray(current.skipTurns) ? [...current.skipTurns] : [false,false,false,false];
        // 15マス目の4位は「1回休み」ではなく2マス戻る。
        // 既存のskipTurnsは、このイベントでは変更しない。

        return {
          ...current,
          positions,
          skipTurns,
          playerIndices,
          currentTeamIndex: (currentTeam + 1) % 4,
          turnActionLocked: false,
          turnActionLockedAt: 0,
          activeKmyakBattle: false,
          kmyakBattlePhase: 'idle',
          kmyakBattleTeamIndex: null,
          kmyakBattleResultRank: null,
          kmyakBattleResultOwner: null,
          kmyakBattleRank4TeamIndex: null,
          kmyakBattleResolved: false
        };
      }).catch(() => null);

      if (!finalize || !finalize.committed) return;

      gameState = finalize.snapshot.val() || gameState;
      removeKmyakBattleOverlay();
      updateBoardImage();
      updateUI();
      isMoving = false;
      scheduleCameraForNextTeam(50);
    }, 4500);
  }

  async function recoverStuckKmyakBattle(eventId = null) {
    if (!window.dbRef) return false;
    const { ref, runTransaction, get, db } = window.dbRef;
    const localEventId = String(eventId || gameState.kmyakBattleEventId || '');
    if (!localEventId) return false;

    // 端末側のgameStateが古いまま残っている場合があるため、
    // 「代理で振る」を押した端末では、まずFirebaseの最新状態を直接取得する。
    // これにより、別端末がすでに結果処理を終えていても「復旧できませんでした」
    // にならず、その最新状態へ追従できる。
    let latestState = null;
    try {
      const latestSnapshot = await get(ref(db, 'gameState'));
      latestState = latestSnapshot.val() || null;
    } catch (e) {
      latestState = null;
    }

    if (latestState) {
      const latestEventId = String(latestState.kmyakBattleEventId || '');

      // 別端末がすでにこのイベントを正常終了させていた場合は、
      // その最新状態をこの端末へ反映して復旧完了とする。
      if (latestEventId === localEventId &&
          (!latestState.activeKmyakBattle || latestState.kmyakBattlePhase === 'idle')) {
        gameState = latestState;
        if (kmyakResultRecoveryTimer) {
          clearTimeout(kmyakResultRecoveryTimer);
          kmyakResultRecoveryTimer = null;
        }
        kmyakResultRecoveryEventId = null;
        removeKmyakBattleOverlay();
        updateBoardImage();
        updateUI();
        isMoving = false;
        scheduleCameraForNextTeam(50);
        return true;
      }
    }

    const targetEventId = String(
      (latestState && latestState.kmyakBattleEventId) || localEventId
    );
    if (!targetEventId) return false;

    // 最新状態を使って結果画面の復旧を行う。
    // 同時に複数端末から押されても、Firebase transactionで1回だけ確定する。
    const tx = await runTransaction(ref(db, 'gameState'), current => {
      if (!current) return;
      if (String(current.kmyakBattleEventId || '') !== targetEventId) return;
      if (!current.activeKmyakBattle || current.kmyakBattlePhase !== 'result') return;

      const eventTeamIndex = Number(current.kmyakBattleResultOwner ?? current.kmyakBattleTeamIndex);
      const rank = Number(current.kmyakBattleResultRank);
      if (!Number.isInteger(eventTeamIndex) || eventTeamIndex < 0 || eventTeamIndex > 3) return;
      if (![1, 2, 3, 4].includes(rank)) return;

      const currentTeam = Number(current.currentTeamIndex);
      const playerIndices = Array.isArray(current.playerIndices) ? [...current.playerIndices] : [0,0,0,0];
      const players = getRealTeamPlayers(currentTeam);
      if (players.length > 0) {
        playerIndices[currentTeam] = (Number(playerIndices[currentTeam] || 0) + 1) % players.length;
      } else {
        playerIndices[currentTeam] = 0;
      }

      const positions = Array.isArray(current.positions) ? [...current.positions] : [0,0,0,0];
      const goalIndex = totalTiles - 1;
      const currentPos = Number(positions[eventTeamIndex] || 0);
      if (rank === 1) {
        positions[eventTeamIndex] = Math.min(goalIndex, currentPos + 2);
      } else if (rank === 4) {
        const rank4TeamIndex = Number(current.kmyakBattleRank4TeamIndex);
        if (Number.isInteger(rank4TeamIndex) && rank4TeamIndex >= 0 && rank4TeamIndex < 4) {
          positions[rank4TeamIndex] = Math.max(0, Number(positions[rank4TeamIndex] || 0) - 2);
        }
      }

      const skipTurns = Array.isArray(current.skipTurns) ? [...current.skipTurns] : [false,false,false,false];
      // 15マス目の4位は1回休みではないため、skipTurnsは変更しない。

      return {
        ...current,
        positions,
        skipTurns,
        playerIndices,
        currentTeamIndex: (currentTeam + 1) % 4,
        turnActionLocked: false,
        turnActionLockedAt: 0,
        activeKmyakBattle: false,
        kmyakBattlePhase: 'idle',
        kmyakBattleTeamIndex: null,
        kmyakBattleResultRank: null,
        kmyakBattleResultOwner: null,
        kmyakBattleResolved: false
      };
    }).catch(() => null);

    if (!tx || !tx.committed) {
      // 直前に別端末が確定した場合も、最後に最新状態を読み直す。
      try {
        const latestSnapshot = await get(ref(db, 'gameState'));
        const afterLatest = latestSnapshot.val() || null;
        if (afterLatest && String(afterLatest.kmyakBattleEventId || '') === targetEventId &&
            (!afterLatest.activeKmyakBattle || afterLatest.kmyakBattlePhase === 'idle')) {
          gameState = afterLatest;
          if (kmyakResultRecoveryTimer) {
            clearTimeout(kmyakResultRecoveryTimer);
            kmyakResultRecoveryTimer = null;
          }
          kmyakResultRecoveryEventId = null;
          removeKmyakBattleOverlay();
          updateBoardImage();
          updateUI();
          isMoving = false;
          scheduleCameraForNextTeam(50);
          return true;
        }
      } catch (e) {}
      return false;
    }

    const before = latestState || gameState;
    const after = tx.snapshot.val() || gameState;
    const eventTeamIndex = Number(
      before.kmyakBattleResultOwner ?? before.kmyakBattleTeamIndex
    );
    const rank = Number(before.kmyakBattleResultRank);
    const moveTeamIndex = rank === 4 ? Number(before.kmyakBattleRank4TeamIndex) : eventTeamIndex;
    const oldPos = Number(before.positions?.[moveTeamIndex] || 0);
    const newPos = Number(after.positions?.[moveTeamIndex] || oldPos);
    if (rank === 1 && newPos > oldPos) {
      publishSharedMoveEvent(moveTeamIndex, oldPos, newPos, false);
    } else if (rank === 4 && newPos < oldPos) {
      publishSharedMoveEvent(moveTeamIndex, oldPos, newPos, true);
    }

    gameState = after;
    if (kmyakResultRecoveryTimer) {
      clearTimeout(kmyakResultRecoveryTimer);
      kmyakResultRecoveryTimer = null;
    }
    kmyakResultRecoveryEventId = null;
    removeKmyakBattleOverlay();
    updateBoardImage();
    updateUI();
    isMoving = false;
    scheduleCameraForNextTeam(50);
    return true;
  }

  function scheduleKmyakResultRecovery() {
    const eventId = String(gameState.kmyakBattleEventId || '');
    if (!eventId || gameState.kmyakBattlePhase !== 'result') return;
    if (kmyakResultRecoveryEventId === eventId && kmyakResultRecoveryTimer) return;

    if (kmyakResultRecoveryTimer) clearTimeout(kmyakResultRecoveryTimer);
    kmyakResultRecoveryEventId = eventId;
    // 通常の結果処理を優先し、それでも残っている場合だけ救済する。
    kmyakResultRecoveryTimer = setTimeout(() => {
      kmyakResultRecoveryTimer = null;
      recoverStuckKmyakBattle(eventId);
    }, 6000);
  }

  function renderKmyakBattleOverlay() {
    const board = document.getElementById('board');
    let overlay = board.querySelector('.kmyak-battle-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'kmyak-battle-overlay';
      board.appendChild(overlay);
    }

    if (gameState.kmyakBattlePhase === "countdown") {
      overlay.innerHTML = `
        <div class="kmyak-battle-title">花火が始まる前の大混雑に巻き込まれて身動きが取れない！</div>
        <div class="kmyak-battle-desc">ボタンを連続でタップして抜け出そう！</div>
        <div class="kmyak-countdown">${gameState.kmyakBattleCountdown}</div>
      `;
    } else if (gameState.kmyakBattlePhase === "battle") {
      overlay.innerHTML = `
        <div class="kmyak-battle-title">🔥 連打バトル中！ (${gameState.kmyakBattleTimer}秒) 🔥</div>
        <div class="kmyak-battle-desc">チームみんなでボタンを連打しまくれ！！</div>
        <button class="kmyak-tap-btn" onclick="handleKmyakTap()">連打する！</button>
        <div class="kmyak-stats">
          赤: ${gameState.kmyakTaps[0]}回 | 青: ${gameState.kmyakTaps[1]}回<br>
          緑: ${gameState.kmyakTaps[2]}回 | 黄: ${gameState.kmyakTaps[3]}回
        </div>
      `;
    } else if (gameState.kmyakBattlePhase === "result") {
      let avgTexts = [];
      for (let i = 0; i < 4; i++) {
        const totalTaps = gameState.kmyakTaps[i] || 0;
        const memberCount = Math.max(1, teamPlayers[i].filter(name => !name.includes("募集中")).length);
        const avg = totalTaps / memberCount;
        avgTexts.push(`${teamNames[i]}: ${avg.toFixed(1)}回`);
      }

      const owner = Number(gameState.kmyakBattleResultOwner);
      const rank = Number(gameState.kmyakBattleResultRank);
      let resultText = "";
      if (rank === 1) {
        resultText = `${teamNames[owner] || ""}：大混雑を抜け出すことに成功。2マス進む。`;
      } else if (rank === 4) {
        resultText = `${teamNames[owner] || ""}：大混雑を抜け出せなかった。2マス戻る。`;
      } else if (rank === 2 || rank === 3) {
        resultText = `${teamNames[owner] || ""}：${rank}位。そのままです。`;
      }

      overlay.innerHTML = `
        <div class="kmyak-battle-title">🎉 大混雑脱出連打ゲーム 結果 🎉</div>
        <div class="kmyak-battle-desc" style="font-size:11px; margin-bottom:4px; background:rgba(0,0,0,0.3); padding:4px; border-radius:6px;">
          <strong>【各チームの平均タップ数】</strong><br>
          ${avgTexts.join(" | ")}
        </div>
        <div class="kmyak-battle-desc" style="font-size:12px; color:#ffeb3b; font-weight:bold;">
          ${resultText}
        </div>
      `;
    }
  }

  function removeKmyakBattleOverlay() {
    const board = document.getElementById('board');
    const overlay = board.querySelector('.kmyak-battle-overlay');
    if (overlay) overlay.remove();
  }

  function triggerQuizEvent() {
    if (isSpectator || gameState.quizTriggered) return;
    gameState.quizTriggered = true;
    // クイズ開始後は2問目の出題待ち時間も含めてサイコロをロック。
    gameState.quizTurnLocked = true;
    gameState.quizCountdownActive = false;
    gameState.quizCountdown = 0;
    gameState.quizUsedIndices = [];
    gameState.quizRoundId = 0;
    gameState.activeQuiz = null;
    syncGameState();

    // 対決開始エフェクトは使わず、メッセージ表示後に3カウントを開始。
    showScreenMessage('🧠 クイズ民に遭遇😃！<br>クイズバトルだ！', 1600);
    setTimeout(() => startQuizCountdown(() => startNextQuizRound(true)), 1700);
  }

  function startQuizCountdown(onComplete) {
    gameState.quizCountdownActive = true;
    gameState.quizCountdown = 3;
    syncGameState();
    showQuizCountdown(3);
    soundEffect.quizStart();

    let count = 3;
    const timer = setInterval(() => {
      count--;
      if (count > 0) {
        gameState.quizCountdown = count;
        syncGameState();
        showQuizCountdown(count);
        soundEffect.quizStart();
      } else {
        clearInterval(timer);
        gameState.quizCountdownActive = false;
        gameState.quizCountdown = 0;
        syncGameState();
        const overlay = document.querySelector('.quiz-countdown-overlay');
        if (overlay) overlay.remove();
        setTimeout(() => onComplete(), 100);
      }
    }, 1000);
  }

  function showQuizCountdown(count) {
    const board = document.getElementById('board');
    if (!board) return;
    let overlay = board.querySelector('.quiz-countdown-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'quiz-countdown-overlay';
      board.appendChild(overlay);
    }
    overlay.innerHTML = `<div class="quiz-countdown-number">${count}</div>`;
    if (count <= 0) overlay.remove();
  }


  async function startNextQuizRound(skipCountdown = false) {
    const sharedUsed = Array.isArray(gameState.quizUsedIndices)
      ? [...gameState.quizUsedIndices]
      : [...usedQuizIndices];

    if (sharedUsed.length >= 2) {
      activeQuiz = null;
      gameState.activeQuiz = null;
      gameState.quizTurnLocked = false;
      gameState.quizCountdownActive = false;
      gameState.quizRoundCountdownStarted = false;
      gameState.quizUsedIndices = sharedUsed;
      syncGameState();
      closeQuizOverlay();
      pushLog("🧠 クイズバトルが終了しました！すごろくを再開します。");
      updateUI();
      isMoving = false;
      advanceTurn();
      scheduleCameraForNextTeam(100);
      return;
    }

    if (!skipCountdown && sharedUsed.length >= 1 &&
        !gameState.quizCountdownActive && !gameState.quizRoundCountdownStarted &&
        !gameState.activeMyakuNyokki) {
      gameState.quizRoundCountdownStarted = true;
      syncGameState();
      startQuizCountdown(() => {
        gameState.quizRoundCountdownStarted = false;
        syncGameState();
        startNextQuizRound(true);
      });
      return;
    }

    const availableIndices = [];
    for (let i = 0; i < allQuizPool.length; i++) {
      if (!sharedUsed.includes(i)) availableIndices.push(i);
    }

    if (availableIndices.length === 0) {
      activeQuiz = null;
      gameState.activeQuiz = null;
      gameState.quizTurnLocked = false;
      gameState.quizCountdownActive = false;
      gameState.quizRoundCountdownStarted = false;
      syncGameState();
      closeQuizOverlay();
      updateUI();
      isMoving = false;
      advanceTurn();
      return;
    }

    const chosenIdx = availableIndices[Math.floor(Math.random() * availableIndices.length)];
    sharedUsed.push(chosenIdx);
    usedQuizIndices = [...sharedUsed];

    const q = allQuizPool[chosenIdx];
    quizProcessedChatIds.clear();
    quizAnswerLocked = false;

    const roundId = Number(gameState.quizRoundId || 0) + 1;
    const startTime = Date.now();

    activeQuiz = {
      emojis: q.emojis,
      answer: q.answer,
      hint: q.hint,
      active: true,
      questionNumber: sharedUsed.length,
      startTime,
      roundId,
      usedIndices: [...sharedUsed]
    };

    gameState.quizUsedIndices = sharedUsed;
    gameState.quizRoundId = roundId;
    gameState.activeQuiz = activeQuiz;
    gameState.quizTurnLocked = true;
    syncGameState();
    updateUI();

    soundEffect.event();
    pushLog(`【会場でクイズ民と遭遇😃！クイズバトルだ！ 第${activeQuiz.questionNumber}問】チャットにひらがなで答えよう！（制限時間30秒）サイコロは一時中止されます。`);
    showQuizOverlay(activeQuiz);
    startQuizTimer(startTime);
    scheduleCpuQuizAnswers();
  }

  function showQuizOverlay(qData) {
    const board = document.getElementById('board');
    const existing = board.querySelector('.quiz-overlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.className = 'quiz-overlay';
    overlay.id = 'quiz-overlay';

    quizTimeRemaining = Number(qData.timeLimit || 30);
    const isFinalGoal = !!qData.finalGoal;

    overlay.innerHTML = `
      <div class="quiz-title">${isFinalGoal ? '<span style="font-size:28px; line-height:1.2; display:block;">🔥 クイズ館長からの挑戦状🔥</span>' : `会場でクイズ民と遭遇😃！クイズバトルだ！ (第${qData.questionNumber}/2問) 🧠`}</div>
      <div class="quiz-timer">残り時間: <span id="quiz-timer-sec">${quizTimeRemaining}</span>秒</div>
      <div class="quiz-emojis">${qData.emojis}</div>
      <div class="quiz-hint">ヒント: ${qData.hint}</div>
      <div style="font-size:9px; color:#555;">${isFinalGoal ? '挑戦できるのは20マス目にぴったり止まったチームだけ！' : 'チャット欄に「ひらがな」で早く正解したチームが2マス進む！'}</div>
    `;
    board.appendChild(overlay);
  }

  function scheduleCpuQuizAnswers() {
    cpuQuizTimers.forEach(t => clearTimeout(t));
    cpuQuizTimers = [];
    if (!isCpuController() || !activeQuiz || !activeQuiz.active) return;

    // CPU「ふつう」：各CPUチームが一定確率で参加。少し時間をかけて回答する。
    for (let teamIndex = 0; teamIndex < 4; teamIndex++) {
      if (!isCpuTeam(teamIndex)) continue;
      if (Math.random() < 0.35) continue;

      const delay = 5000 + Math.floor(Math.random() * 11000);
      const timer = setTimeout(() => {
        if (!activeQuiz || !activeQuiz.active || quizAnswerLocked) return;
        const playerName = "🤖 CPU";
        if (Math.random() < 0.75) {
          pushLog(`🤖 ${teamNames[teamIndex]}（CPU）がクイズに挑戦！`);
          handleQuizCorrect(teamIndex, playerName);
        } else {
          pushLog(`🤖 ${teamNames[teamIndex]}（CPU）がクイズに挑戦しましたが、不正解…！`);
        }
      }, delay);
      cpuQuizTimers.push(timer);
    }
  }

  function startQuizTimer(startTime = Date.now()) {
    if (quizTimer) clearInterval(quizTimer);

    const timeLimit = Number(activeQuiz?.timeLimit || 30);
    const elapsed = Math.floor((Date.now() - Number(startTime || Date.now())) / 1000);
    quizTimeRemaining = Math.max(0, timeLimit - elapsed);

    const secSpan = document.getElementById('quiz-timer-sec');
    if (secSpan) secSpan.innerText = quizTimeRemaining;

    if (quizTimeRemaining <= 0) {
      endQuizRound("時間切れ！正解者なしでした。");
      return;
    }

    quizTimer = setInterval(() => {
      quizTimeRemaining--;
      const sec = document.getElementById('quiz-timer-sec');
      if (sec) sec.innerText = quizTimeRemaining;

      if (quizTimeRemaining <= 0) {
        clearInterval(quizTimer);
        quizTimer = null;
        endQuizRound("時間切れ！正解者なしでした。");
      }
    }, 1000);
  }

  async function startFinalGoalQuiz(teamIndex) {
    if (isSpectator || gameState.isGameOver || gameState.activeQuiz || gameState.quizTurnLocked) return;

    const chosenIdx = Math.floor(Math.random() * allQuizPool.length);
    const q = allQuizPool[chosenIdx];
    const roundId = Number(gameState.quizRoundId || 0) + 1;

    gameState.quizTurnLocked = true;
    gameState.quizCountdownActive = false;
    gameState.quizRoundCountdownStarted = false;
    gameState.quizRoundId = roundId;
    gameState.activeQuiz = null;
    syncGameState();
    updateUI();

    hideBoardMessage();
    soundEffect.finalTrial();
    showScreenMessage('<span style="font-size:24px !important; line-height:1.25; color:#ffeb3b; font-weight:900; white-space:nowrap;">🔥クイズ館長から挑戦状🔥<br><span style="font-size:24px !important; color:#fff; white-space:nowrap;">「万博の締めはな<br>そらクイズやろ‼️」</span></span>', 2500);

    await new Promise(resolve => setTimeout(resolve, 2500));
    if (gameState.isGameOver) return;

    startQuizCountdown(() => startFinalGoalQuizRound(teamIndex, q, roundId));
  }

  function startFinalGoalQuizRound(teamIndex, q, roundId) {
    if (gameState.isGameOver) return;
    quizProcessedChatIds.clear();
    quizAnswerLocked = false;

    activeQuiz = {
      emojis: q.emojis,
      answer: q.answer,
      hint: q.hint,
      active: true,
      questionNumber: 1,
      startTime: Date.now(),
      roundId,
      usedIndices: [],
      finalGoal: true,
      targetTeam: Number(teamIndex),
      timeLimit: 15
    };

    gameState.activeQuiz = activeQuiz;
    gameState.quizTurnLocked = true;
    syncGameState();
    updateUI();
    soundEffect.event();
    pushLog(`🔥 ${teamNames[teamIndex]} に最後の試練！15秒以内にクイズに答えよう！`);
    showQuizOverlay(activeQuiz);
    startQuizTimer(activeQuiz.startTime);
    scheduleFinalGoalCpuAnswer(teamIndex);
  }

  function scheduleFinalGoalCpuAnswer(teamIndex) {
    cpuQuizTimers.forEach(t => clearTimeout(t));
    cpuQuizTimers = [];
    if (!isCpuTeam(Number(teamIndex))) return;

    // 最終問題はゴールしたCPUチームも15秒以内に挑戦する。
    const delay = 5000 + Math.floor(Math.random() * 5000);
    const timer = setTimeout(() => {
      if (!activeQuiz || !activeQuiz.active || !activeQuiz.finalGoal || quizAnswerLocked) return;
      if (Number(activeQuiz.targetTeam) !== Number(teamIndex)) return;
      const playerName = "🤖 CPU";
      if (Math.random() < 0.8) {
        pushLog(`🤖 ${teamNames[teamIndex]}（CPU）が最後の試練に挑戦！`);
        handleFinalGoalQuizCorrect(teamIndex, playerName);
      } else {
        soundEffect.wrong();
        pushLog(`🤖 ${teamNames[teamIndex]}（CPU）が最後の試練に挑戦しましたが、不正解…！`);
      }
    }, delay);
    cpuQuizTimers.push(timer);
  }

  async function handleFinalGoalQuizCorrect(teamIndex, playerName) {
    if (!activeQuiz || !activeQuiz.active || !activeQuiz.finalGoal ||
        Number(teamIndex) !== Number(activeQuiz.targetTeam) || quizAnswerLocked) return;

    const roundId = Number(activeQuiz.roundId || activeQuiz.startTime || 0);
    const { ref, runTransaction, db } = window.dbRef;
    const claim = await runTransaction(ref(db, `gameState/quizAnswerClaims/${roundId}`), current => {
      if (current) return;
      return { type: 'finalGoalCorrect', teamIndex: Number(teamIndex), playerName, claimedAt: Date.now() };
    }).catch(() => null);
    if (!claim || !claim.committed) return;

    quizAnswerLocked = true;
    activeQuiz.active = false;
    cpuQuizTimers.forEach(t => clearTimeout(t));
    cpuQuizTimers = [];
    if (quizTimer) { clearInterval(quizTimer); quizTimer = null; }
    gameState.activeQuiz = null;
    gameState.quizTurnLocked = true;
    syncGameState();
    closeQuizOverlay(false);
    hideBoardMessage();

    soundEffect.goal();
    pushLog(`🎉 ${teamNames[teamIndex]} が最後の試練に正解！ゴール！`);

    // 正解後は2秒待って20マス目のアナウンス、その2秒後に表彰。
    await new Promise(resolve => setTimeout(resolve, 2000));
    showSquareMessage(teamIndex, totalTiles - 1);
    await new Promise(resolve => setTimeout(resolve, 2000));

    const winningMembers = Object.values(allUsers)
      .filter(u => u.team === teamIndex)
      .map(u => u.name)
      .join('、');
    showWinBanner(teamNames[teamIndex], winningMembers);
    gameState.isGameOver = true;
    gameState.quizTurnLocked = false;
    syncGameState();
    updateUI();
    isMoving = false;
    zoomOutAfterGameOver();
  }

  async function handleFinalGoalQuizWrong(teamIndex, playerName, answerText = '') {
    if (!activeQuiz || !activeQuiz.active || !activeQuiz.finalGoal ||
        Number(teamIndex) !== Number(activeQuiz.targetTeam) || quizAnswerLocked) return;

    const roundId = Number(activeQuiz.roundId || activeQuiz.startTime || 0);
    const { ref, runTransaction, db } = window.dbRef;
    const claim = await runTransaction(ref(db, `gameState/quizAnswerClaims/${roundId}`), current => {
      if (current) return;
      return { type: 'finalGoalWrong', teamIndex: Number(teamIndex), playerName, claimedAt: Date.now() };
    }).catch(() => null);
    if (!claim || !claim.committed) return;

    quizAnswerLocked = true;
    activeQuiz.active = false;
    cpuQuizTimers.forEach(t => clearTimeout(t));
    cpuQuizTimers = [];
    if (quizTimer) { clearInterval(quizTimer); quizTimer = null; }
    gameState.activeQuiz = null;
    syncGameState();
    closeQuizOverlay(false);

    showWrongBanner(`${playerName}さんの回答${answerText}は不正解…！`);
    pushLog(`❌ ${teamNames[teamIndex]} は最後の試練に不正解。3マス戻ります。`);
    await new Promise(resolve => setTimeout(resolve, 1000));

    const oldPos = Number(gameState.positions[teamIndex] || 0);
    const backTarget = Math.max(0, oldPos - 3);
    await movePieceStepByStep(teamIndex, oldPos, backTarget, true);
    gameState.positions[teamIndex] = backTarget;
    syncGameState();
    updateBoardImage();
    hideBoardMessage();
    const wrongBanner = document.querySelector('.wrong-banner');
    if (wrongBanner) wrongBanner.remove();

    isMoving = false;
    gameState.quizTurnLocked = false;
    advanceTurn();
    scheduleCameraForNextTeam(50);
  }

  async function handleQuizCorrect(teamIndex, playerName) {
    if (activeQuiz && activeQuiz.finalGoal) {
      return handleFinalGoalQuizCorrect(teamIndex, playerName);
    }
    if (!activeQuiz || !activeQuiz.active || quizAnswerLocked) return;

    const roundId = Number(activeQuiz.roundId || activeQuiz.startTime || 0);
    const { ref, runTransaction, db } = window.dbRef;

    // 多人数接続時でも、同じ正解を複数端末が同時処理しない。
    const claim = await runTransaction(ref(db, `gameState/quizAnswerClaims/${roundId}`), current => {
      if (current) return;
      return { teamIndex, playerName, claimedAt: Date.now() };
    }).catch(() => null);

    if (!claim || !claim.committed) return;

    quizAnswerLocked = true;
    activeQuiz.active = false;

    if (quizTimer) {
      clearInterval(quizTimer);
      quizTimer = null;
    }

    gameState.activeQuiz = null;
    syncGameState();

    soundEffect.goal();

    const tName = teamNames[teamIndex];
    pushLog(`🎉 正解！ ${playerName} (${tName}) が一番早く正解しました！(+2マス)`);
    showScreenMessage(`🎉 正解！ 🎉<br><span style="color:#ffeb3b; font-size:15px;">${playerName}さん</span><br><span style="font-size:12px;">${tName} が正解！ 2マス進みます！</span>`, 3000);

    const goalIndex = totalTiles - 1;
    const oldPos = gameState.positions[teamIndex];
    const rawTarget = Math.min(goalIndex, oldPos + 2);
    const forwardTarget = calculateMovementTarget(oldPos, rawTarget);

    movePieceStepByStep(teamIndex, oldPos, forwardTarget, false).then(async () => {
      // クイズの追加移動は、古いgameState全体をset()してしまうと、
      // 別端末の古いpositionsで正解チームの位置が元に戻ることがある。
      // 最新のFirebase状態に対して「このチームの位置だけ」を確定する。
      const positionRef = ref(db, `gameState/positions/${teamIndex}`);
      const positionClaim = await runTransaction(positionRef, current => {
        return forwardTarget;
      }).catch(() => null);

      // Firebaseで確定した位置をローカル状態にも反映。
      gameState.positions[teamIndex] = forwardTarget;
      if (positionClaim && positionClaim.committed) {
        gameState.positions[teamIndex] = Number(positionClaim.snapshot.val());
      }
      updateBoardImage();
      updateUI();

      // closeQuizOverlay()内の全体syncは、古いpositionsを再送する可能性があるため、
      // このクイズ処理では同期せずに閉じる。
      closeQuizOverlay(false);

      setTimeout(() => {
        startNextQuizRound();
      }, 3200);
    });
  }

  async function endQuizRound(message) {
    if (activeQuiz && activeQuiz.finalGoal) {
      return handleFinalGoalQuizWrong(activeQuiz.targetTeam, '時間切れ', '');
    }
    if (!activeQuiz || !activeQuiz.active) return;

    const roundId = Number(activeQuiz.roundId || activeQuiz.startTime || 0);
    const { ref, runTransaction, db } = window.dbRef;
    const claim = await runTransaction(ref(db, `gameState/quizAnswerClaims/${roundId}`), current => {
      if (current) return;
      return { type: "timeout", claimedAt: Date.now() };
    }).catch(() => null);

    if (!claim || !claim.committed) return;

    activeQuiz.active = false;

    if (quizTimer) {
      clearInterval(quizTimer);
      quizTimer = null;
    }

    gameState.activeQuiz = null;
    syncGameState();

    showWrongBanner(message);
    pushLog(`⏰ ${message}`);
    closeQuizOverlay();

    setTimeout(() => {
      startNextQuizRound();
    }, 1500);
  }

  function closeQuizOverlay(sync = true) {
    cpuQuizTimers.forEach(t => clearTimeout(t));
    cpuQuizTimers = [];
    if (quizTimer) {
      clearInterval(quizTimer);
      quizTimer = null;
    }
    const board = document.getElementById('board');
    const overlay = board.querySelector('.quiz-overlay');
    if (overlay) overlay.remove();
    const countdownOverlay = document.querySelector('.quiz-countdown-overlay');
    if (countdownOverlay) countdownOverlay.remove();
    activeQuiz = null;
    gameState.activeQuiz = null;
    hideBoardMessage();
    if (sync) syncGameState();
    updateUI();
    requestAnimationFrame(() => refreshDiceAvailability());
  }

    if (myak5ImagePreloaded) return myak5ImagePreloaded;
    myak5ImagePreloaded = new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = 'myak5.jpg';
    });
    return myak5ImagePreloaded;

    cards.sort(() => Math.random() - 0.5);

    overlay.innerHTML = `
      <div class="lottery-title">巨大なぬいぐるみを持った人を見かけ、くじが引きたくなった！<br>✨ ミャクミャクくじに挑戦！ ✨<br><span style="font-size:9px; font-weight:normal; color:#555;">(5マス目到着の ${teamNames[teamIndex]} / ${lotteryTargetPlayerName} さん)</span></div>
      <div class="lottery-timer">残り: <span id="lottery-timer-sec">${lotteryTimeRemaining}</span>秒</div>
      <div class="lottery-cards">
        <div class="lottery-card" onclick="chooseLottery(${cards[0].prize})">くじA</div>
        <div class="lottery-card" onclick="chooseLottery(${cards[1].prize})">くじB</div>
        <div class="lottery-card" onclick="chooseLottery(${cards[2].prize})">くじC</div>
      </div>
    `;
    board.appendChild(overlay);

    // CPU（ふつう）は少し考えてから、A～Cのいずれかを選ぶ。
    if (shouldSync && isCpuTeam(teamIndex) && isCpuController()) {
      setTimeout(() => {
        if (!gameState.activeLottery || lotteryTargetTeam !== teamIndex) return;
        const prize = Math.floor(Math.random() * 3) + 1;
        resolveLottery(prize, false);
      }, 2200 + Math.floor(Math.random() * 1800));
    }

    if (lotteryTimer) clearInterval(lotteryTimer);
    lotteryTimer = setInterval(() => {
      lotteryTimeRemaining--;
      const secSpan = document.getElementById('lottery-timer-sec');
      if (secSpan) secSpan.innerText = lotteryTimeRemaining;

      if (lotteryTimeRemaining <= 0) {
        clearInterval(lotteryTimer);
        lotteryTimer = null;
        resolveLottery(3, true);
      }
    }, 1000);
  }

  function chooseLottery(prizeIndex) {
    if (isSpectator || !gameState.activeLottery) return;
    
    const isMyTeamLottery = (myTeamIndex === lotteryTargetTeam);
    const isTargetPerson = (myUserName === lotteryTargetPlayerName);

    if (!isMyTeamLottery || !isTargetPerson) {
      alert(`このミャクミャクくじに参加できるのは、5マス目に最初に到着したチームの「${lotteryTargetPlayerName}」さんだけです！`);
      return;
    }

    if (lotteryTimer) {
      clearInterval(lotteryTimer);
      lotteryTimer = null;
    }
    resolveLottery(prizeIndex, false);
  }

  function resolveLottery(prize, isTimeout) {
    gameState.activeLottery = false;
    syncGameState();

    const board = document.getElementById('board');
    const overlay = board.querySelector('.lottery-overlay');
    if (overlay) overlay.remove();

    const tIdx = lotteryTargetTeam;
    const goalIndex = totalTiles - 1;
    const oldPos = gameState.positions[tIdx];

    if (isTimeout) {
      soundEffect.wrong();
      pushLog(`⏰ 10秒経過のため、${teamNames[tIdx]} のミャクミャクくじは「3等」になりました！`);
      showScreenMessage(`⏰ タイムアップ！<br>${teamNames[tIdx]} の結果は <span style="color:#ffeb3b;">3等</span> です！`, 3000);
      finishLotteryTurn();
    } else if (prize === 3) {
      soundEffect.event();
      pushLog(`🎁 ${teamNames[tIdx]} がミャクミャクくじを引いた！<br> 結果は「3等」！ そのままの位置です。`);
      showScreenMessage(`🎁 ミャクミャクくじ 結果<br><span style="color:#ffeb3b; font-size:16px;">3等</span>：そのまま！`, 3000);
      finishLotteryTurn();
    } else if (prize === 2) {
      soundEffect.goal();
      pushLog(`🎁 ${teamNames[tIdx]} がミャクミャクくじを引いた！<br> 結果は「2等」！ 1マス進みます！`);
      showScreenMessage(`🎁 ミャクミャクくじ 結果<br><span style="color:#ffeb3b; font-size:16px;">2等</span>：1マス進む！`, 3000);
      
      const rawTarget = Math.min(goalIndex, oldPos + 1);
      const forwardTarget = calculateMovementTarget(oldPos, rawTarget);
      movePieceStepByStep(tIdx, oldPos, forwardTarget, false).then(() => {
        gameState.positions[tIdx] = forwardTarget;
        syncGameState();
        showSquareMessage(tIdx, forwardTarget);
        finishLotteryTurn();
      });
    } else if (prize === 1) {
      soundEffect.goal();
      pushLog(`🎁 ${teamNames[tIdx]} がミャクミャクくじを引いた！<br> なんと「1等」！ 2マス進みます！`);
      showScreenMessage(`🎁 ミャクミャクくじ 結果<br><span style="color:#ffeb3b; font-size:18px;">🎉 1等 🎉</span>：2マス進みます！`, 3500);
      
      const rawTarget = Math.min(goalIndex, oldPos + 2);
      const forwardTarget = calculateMovementTarget(oldPos, rawTarget);
      movePieceStepByStep(tIdx, oldPos, forwardTarget, false).then(() => {
        gameState.positions[tIdx] = forwardTarget;
        syncGameState();
        showSquareMessage(tIdx, forwardTarget);
        finishLotteryTurn();
      });
    }
  }

  function finishLotteryTurn() {
    const tIdx = lotteryTargetTeam;
    const goalIndex = totalTiles - 1;

    if (gameState.positions[tIdx] === goalIndex) {
      soundEffect.goal();
      const winningMembers = Object.values(allUsers)
        .filter(u => u.team === tIdx)
        .map(u => u.name)
        .join("、");

      pushLog(`🎉 優勝：${teamNames[tIdx]}！ おめでとう！ 🎉`);
      showWinBanner(teamNames[tIdx], winningMembers);
      gameState.isGameOver = true;
      syncGameState();
      updateUI();
      zoomOutAfterGameOver();
    } else {
      advanceTurn();
      scheduleCameraForNextTeam(3000);
    }
  }

  function advanceTurn() {
    const currentTeam = gameState.currentTeamIndex;
    const players = getRealTeamPlayers(currentTeam);
    if (players.length > 0) {
      gameState.playerIndices[currentTeam] = (gameState.playerIndices[currentTeam] + 1) % players.length;
    } else {
      gameState.playerIndices[currentTeam] = 0;
    }
    gameState.currentTeamIndex = (gameState.currentTeamIndex + 1) % 4;

    // 次の担当者への切り替えとロック解除を1回の書き込みで行う。
    gameState.turnActionLocked = false;
    gameState.turnActionLockedAt = 0;
    syncGameState();
    scheduleCpuTurn();
  }

  function getRealTeamPlayers(teamIndex) {
    return Object.values(allUsers).filter(u => u && u.team === teamIndex && u.name).map(u => u.name);
  }

  function isCpuTeam(teamIndex) {
    return getRealTeamPlayers(teamIndex).length === 0;
  }

  // CPUの操作を複数端末が同時に実行しないよう、接続中の先頭プレイヤーをCPU操作担当端末にする。
  function isCpuController() {
    const names = Object.values(allUsers).filter(u => u && u.name).map(u => u.name).sort();
    return !!myUserName && names.length > 0 && names[0] === myUserName;
  }

  function scheduleCpuTurn() {
    if (cpuTimer) {
      clearTimeout(cpuTimer);
      cpuTimer = null;
    }

    if (!gameState.gameStarted || gameState.isGameOver) return;
    if (!isCpuController()) return;

    const teamIndex = Number(gameState.currentTeamIndex);
    if (!Number.isInteger(teamIndex) || teamIndex < 0 || teamIndex >= 4) return;
    if (!isCpuTeam(teamIndex)) return;

    if (!Array.isArray(gameState.playerIndices)) {
      gameState.playerIndices = [0, 0, 0, 0];
    }

    if (gameState.playerIndices[teamIndex] !== 0) {
      gameState.playerIndices[teamIndex] = 0;
      syncGameState();
    }

    lastCpuTurnKey = `${teamIndex}-cpu`;

    const retry = (delay = 500) => {
      if (cpuTimer) clearTimeout(cpuTimer);
      cpuTimer = setTimeout(() => {
        cpuTimer = null;
        scheduleCpuTurn();
      }, delay);
    };

    if ((gameState.turnActionLocked &&
         (!gameState.turnActionLockedAt || Date.now() - Number(gameState.turnActionLockedAt) < 20000)) ||
        gameState.quizTurnLocked ||
        gameState.activeQuiz ||
        gameState.activeLottery ||
        gameState.activeKmyakBattle ||
        gameState.activeMyakuNyokki ||
        gameState.activeMushroomTime ||
        gameState.mushroomTimeTurnLocked ||
        isMoving) {
      retry();
      return;
    }

    cpuTimer = setTimeout(async () => {
      cpuTimer = null;

      if (!gameState.gameStarted || gameState.isGameOver) return;
      if (!isCpuController()) return;

      if (Number(gameState.currentTeamIndex) !== teamIndex) {
        scheduleCpuTurn();
        return;
      }
      if (!isCpuTeam(teamIndex)) return;

      if ((gameState.turnActionLocked &&
           (!gameState.turnActionLockedAt || Date.now() - Number(gameState.turnActionLockedAt) < 20000)) ||
          gameState.quizTurnLocked ||
          gameState.activeQuiz ||
          gameState.activeLottery ||
          gameState.activeKmyakBattle ||
          gameState.activeMyakuNyokki ||
          gameState.activeMushroomTime ||
          gameState.mushroomTimeTurnLocked ||
          isMoving) {
        retry();
        return;
      }

      // Firebase transactionで別端末に先を越された場合も、次の状態更新で再試行する。
      await executeDiceRoll({ cpu: true });

      // 実行が即座に拒否された場合（競合など）は、CPUターンが残っている限り再試行。
      if (!isMoving &&
          gameState.gameStarted &&
          !gameState.isGameOver &&
          Number(gameState.currentTeamIndex) === teamIndex &&
          isCpuTeam(teamIndex)) {
        retry(700);
      }
    }, 900);
  }

  function syncGameState() {
    const { ref, set, db } = window.dbRef;
    set(ref(db, 'gameState'), gameState);
  }

  async function animateDice(targetValue) {
    return new Promise((resolve) => {
      soundEffect.diceRoll();
      const cube = document.getElementById('dice-cube');
      const rotations = {
        1: { x: 0, y: 0 },
        2: { x: 0, y: -180 },
        3: { x: 0, y: -90 },
        4: { x: 0, y: 90 },
        5: { x: -90, y: 0 },
        6: { x: 90, y: 0 }
      };

      const targetRot = rotations[targetValue];
      cube.style.transform = `rotateX(${targetRot.x + 1440}deg) rotateY(${targetRot.y + 1080}deg)`;

      setTimeout(() => {
        cube.style.transition = 'none';
        cube.style.transform = `rotateX(${targetRot.x}deg) rotateY(${targetRot.y}deg)`;
        setTimeout(() => {
          cube.style.transition = 'transform 0.8s cubic-bezier(0.2, 0.8, 0.3, 1)';
        }, 50);
        resolve();
      }, 850);
    });
  }

  function refreshDiceAvailability() {
    const diceBtn = document.getElementById('dice-btn') ||
      document.querySelector('#diceButton, .dice-button, button[onclick*="rollDice"]');
    if (!diceBtn) return;

    const blocked = isMoving || gameState.isGameOver || gameState.activeLottery ||
      activeQuiz || gameState.activeQuiz || gameState.quizTurnLocked ||
      gameState.quizCountdownActive || gameState.quizRoundCountdownStarted ||
      gameState.activeKmyakBattle || gameState.activeMyakuNyokki ||
      gameState.activeMushroomTime || gameState.mushroomTimeTurnLocked;

    if (isMyTurn() && !blocked && !isSpectator && gameState.gameStarted) {
      diceBtn.disabled = false;
      diceBtn.removeAttribute('disabled');
      diceBtn.classList.remove('disabled');
    }
  }


  async function rollDice() {
    refreshDiceAvailability();
    hideBoardMessage();
    if (isMoving || gameState.isGameOver || gameState.activeLottery || activeQuiz || gameState.activeQuiz || gameState.quizTurnLocked || gameState.quizCountdownActive || gameState.quizRoundCountdownStarted || gameState.activeKmyakBattle || gameState.activeMyakuNyokki || gameState.activeMushroomTime || gameState.mushroomTimeTurnLocked) return;

    if (!isMyTurn()) {
      alert("今はあなたの順番ではありません！自分の担当順が回ってくるまでお待ちください。");
      return;
    }

    executeDiceRoll();
  }

  function showGoalEventBanner(type, teamIndex) {
    const board = document.getElementById('board');
    if (!board) return null;

    const overlay = document.createElement('div');
    overlay.className = 'goal-event-overlay';

    const banner = document.createElement('div');
    banner.className = type === 'allnight' ? 'allnight-banner' : 'jam-banner';

    if (type === 'jam') {
      banner.innerHTML = `🚨🚃🚙💦 大混雑に巻き込まれた！ 🚙🚃💦🚨<br><span style="font-size:11px;">${teamNames[teamIndex]} は7マス後退します！</span>`;
    } else {
      banner.innerHTML = `🌙✨ オールナイト万博！ ✨🌙<br><span style="font-size:11px;">大阪メトロ中央線でトラブル発生！！全チーム、13マス目に集合！</span>`;
    }
    overlay.appendChild(banner);

    if (type === 'allnight') {
      for (let i = 0; i < 70; i++) {
        const spark = document.createElement('div');
        spark.className = 'goal-spark';
        spark.style.left = '50%';
        spark.style.top = '45%';
        const angle = Math.random() * Math.PI * 2;
        const distance = 50 + Math.random() * Math.max(board.clientWidth, board.clientHeight) * 0.7;
        spark.style.background = ['#ffeb3b','#ffffff','#33ccff','#ff66ff','#ff3366'][Math.floor(Math.random()*5)];
        spark.style.setProperty('--gx', `${Math.cos(angle) * distance}px`);
        spark.style.setProperty('--gy', `${Math.sin(angle) * distance}px`);
        spark.style.animationDelay = `${Math.random() * 0.35}s`;
        overlay.appendChild(spark);
      }
    }

    board.appendChild(overlay);
    setTimeout(() => overlay.remove(), type === 'allnight' ? 4200 : 2600);
    return overlay;
  }

  async function handleGoalContact(teamIndex, exactGoal, suppliedGoalEventRoll = null) {
    // ゴールに触れたら、5%で大混雑、次の5%でオールナイト万博。
    // それらが起こらなかった「ぴったりゴール」だけ、最後のクイズを100%発生させる。
    const goalEventRoll = suppliedGoalEventRoll == null ? Math.random() : suppliedGoalEventRoll;

    if (goalEventRoll < 0.05) {
      soundEffect.return();
      showGoalEventBanner('jam', teamIndex);
      pushLog(`🚨 ${teamNames[teamIndex]} がゴールに触れた瞬間、大混雑に巻き込まれた！7マス後退！`);
      showScreenMessage(`🚨🚃🚙💦 帰宅時の大混雑発生！ 🚙🚃💦🚨<br><span style="font-size:12px;">7マス後退します！</span>`, 2200);
      await new Promise(r => setTimeout(r, 2200));

      const oldPos = gameState.positions[teamIndex];
      const backTarget = Math.max(0, oldPos - 7);
      await movePieceStepByStep(teamIndex, oldPos, backTarget, true);
      gameState.positions[teamIndex] = backTarget;
      syncGameState();
      updateBoardImage();
      showSquareMessage(teamIndex, backTarget);
      await waitForSquareMessage(3000);
      return { type: 'jam' };
    }

    if (goalEventRoll < 0.10) {
      // オールナイト万博：全チームを13マス目に集め、その間だけ特別背景にする。
      soundEffect.allNight();
      showGoalEventBanner('allnight', teamIndex);
      pushLog(`🌙✨ ${teamNames[teamIndex]} がゴールに触れた瞬間、オールナイト万博が発生！全チームを13マス目に集めます！`);
      showScreenMessage(`🌙✨ オールナイト万博！ ✨🌙<br>大阪メトロ中央線でトラブル発生！！<br><span style="font-size:11px;">全チーム、13マス目に集合！</span>`, 3500);

      const board = document.getElementById('board');
      board.classList.add('goal-shake');
      setTimeout(() => board.classList.remove('goal-shake'), 800);

      // まず盤面全体が見えるようにズームアウトしてから、全チームを13マス目へ集める。
      resetCamera(true);
      await new Promise(r => setTimeout(r, 900));

      gameState.positions = [13, 13, 13, 13];
      gameState.skipTurns = [false, false, false, false];
      gameState.isGameOver = false;
      gameState.currentTeamIndex = teamIndex;
      gameState.playerIndices = [0, 0, 0, 0];
      gameState.lotteryTriggered = true;
      gameState.quizTriggered = true;
      gameState.kmyakBattleTriggered = true;
      gameState.activeQuiz = null;
      gameState.activeLottery = false;
      gameState.activeKmyakBattle = false;
      gameState.kmyakBattlePhase = "idle";
      gameState.kmyakSpawnActive = false;
      gameState.kmyakSpawnTargetTime = null;
      activeQuiz = null;

      syncGameState();
      updateUI();

      // オールナイト発生と同時に全端末で特別背景へ切り替える。
      gameState.allNightActive = true;
      syncGameState();
      applyAllNightBackground(true);

      await new Promise(r => setTimeout(r, 3500));

      // 13マス目への集合が完了し、次のサイコロへ進める段階で通常背景へ戻す。
      gameState.allNightActive = false;
      syncGameState();
      applyAllNightBackground(false);
      updateBoardImage();
      resetCamera(false);
      showSquareMessage(teamIndex, 13);
      await waitForSquareMessage(3000);
      return { type: 'allnight' };
    }

    if (exactGoal) {
      await startFinalGoalQuiz(teamIndex);
      return { type: 'finalGoalQuiz' };
    }

    return { type: 'normal' };
  }

  async function executeDiceRoll(options = {}) {
    // サイコロを押したユーザー操作の中でAudioContextを先に解除しておく。
    // 12マス目イベントはサイコロ操作から数秒後に始まるため、ここで解除しておかないと
    // iPhone等でWeb Audioの自動再生制限によりイベント音が無音になることがある。
    try { getAudioContext().resume(); } catch (e) {}

    const isProxyRoll = !!options.proxy;
    const isRecoveryRoll = !!options.recovery;
    const isCpuRoll = !!options.cpu;

    if (!gameState.gameStarted || (isMoving && !isRecoveryRoll) || gameState.isGameOver ||
        gameState.activeQuiz || gameState.quizTurnLocked || gameState.quizCountdownActive ||
        gameState.quizRoundCountdownStarted || gameState.activeLottery || gameState.activeKmyakBattle ||
        gameState.activeMyakuNyokki || gameState.activeMushroomTime || gameState.mushroomTimeTurnLocked) return;

    // CPUは「自分のプレイヤーが存在するか」ではなく、
    // 現在のチームがCPUかどうかで実行を許可する。
    if (isCpuRoll && (!isCpuController() || !isCpuTeam(Number(gameState.currentTeamIndex)))) {
      return;
    }

    const expectedTeam = Number(gameState.currentTeamIndex);
    const expectedPlayerIndex = Number(gameState.playerIndices[expectedTeam] || 0);
    const expectedPlayers = getRealTeamPlayers(expectedTeam);

    if (!isProxyRoll && !isCpuRoll && !isMyTurn()) return;
    const { ref, runTransaction, db } = window.dbRef;
    const lockClaim = await runTransaction(ref(db, 'gameState'), current => {
      if (!current || !current.gameStarted || current.isGameOver) return;

      if (current.turnActionLocked) {
        const lockedAt = Number(current.turnActionLockedAt || 0);

        // 「代理で振る」は、プレイヤー/CPUが止まった時の救済用。
        // 明示的に押された場合は残ったロックを解除して、このターンを引き継ぐ。
        if (isRecoveryRoll) {
          current.turnActionLocked = false;
          current.turnActionLockedAt = 0;
        } else {
          // 通常操作では20秒未満のロックを尊重する。
          if (lockedAt > 0 && Date.now() - lockedAt < 20000) return;

          // 端末クラッシュ等で20秒以上残ったロックだけ自動回復。
          current.turnActionLocked = false;
          current.turnActionLockedAt = 0;
        }
      }

      if (current.activeQuiz || current.quizTurnLocked || current.quizCountdownActive ||
          current.quizRoundCountdownStarted || current.activeLottery || current.activeKmyakBattle ||
          current.activeMyakuNyokki || current.activeMushroomTime || current.mushroomTimeTurnLocked) return;

      const team = Number(current.currentTeamIndex);
      const pIdx = Number((current.playerIndices || [0,0,0,0])[team] || 0);

      // 古い端末状態での操作を拒否。
      if (team !== expectedTeam || pIdx !== expectedPlayerIndex) return;

      current.turnActionLocked = true;
      current.turnActionLockedAt = Date.now();
      return current;
    }).catch(() => null);

    if (!lockClaim || !lockClaim.committed) return;

    gameState = lockClaim.snapshot.val() || gameState;
    isMoving = true;
    lastRollTime = Date.now();
    firstDiceRolled = true;

    const currentTeamIndex = gameState.currentTeamIndex;
    if (gameState.skipTurns[currentTeamIndex]) {
      gameState.skipTurns[currentTeamIndex] = false;
      syncGameState();
      soundEffect.return();
      pushLog(`⏸️ ${teamNames[currentTeamIndex]} は1回休みのため、今回のターンはスキップされました。`);
      showScreenMessage(`⏸️ ${teamNames[currentTeamIndex]} は1回休み！<br>今回はサイコロを振れません。`, 2500);
      await waitForSquareMessage(2500);
      isMoving = false;
      advanceTurn();
      scheduleCameraForNextTeam(50);
      return;
    }

    // 19マス目に止まっている場合は、ゴール直前の泥沼化を防ぐため
    // 次の出目を「1=50%、2〜6=各10%」にする。
    const diceVal = gameState.positions[gameState.currentTeamIndex] === 19
      ? (Math.random() < 0.50 ? 1 : Math.floor(Math.random() * 5) + 2)
      : Math.floor(Math.random() * 6) + 1;
    await animateDice(diceVal);

    const teamIndex = gameState.currentTeamIndex;
    const oldPos = gameState.positions[teamIndex];
    const goalIndex = totalTiles - 1;
    const rawTarget = oldPos + diceVal;
    const touchesGoal = rawTarget >= goalIndex;
    // ゴールはぴったりならそのまま。オーバーした場合は、超えた分だけ戻る。
    let targetPos = touchesGoal
      ? Math.max(0, goalIndex - (rawTarget - goalIndex))
      : calculateMovementTarget(oldPos, rawTarget);

    // サイコロで最初に到着したマスを保存。
    // その後のイベントによる追加移動先では、別のマス効果を発動させない。
    const diceLandedPos = targetPos;

    pushLog(`${teamNames[teamIndex]} がサイコロを振って「${diceVal}」を出しました！（${oldPos} → ${targetPos}${touchesGoal && rawTarget > goalIndex ? '：ゴールをオーバーして折り返し' : ''}）`);

    if (touchesGoal) {
      // まず実際にゴールへ触れるところまで移動。
      await movePieceStepByStep(teamIndex, oldPos, goalIndex, false);
      gameState.positions[teamIndex] = goalIndex;
      syncGameState();
      updateBoardImage();

      // ぴったりゴールでも、大渋滞・オールナイト万博が起こらない場合は
      // 20マス目の通常アナウンスを出さず、最後のクイズへ進む。
      const exactGoal = rawTarget === goalIndex;
      const goalEventRoll = Math.random();
      const willFinalGoalQuiz = exactGoal && goalEventRoll >= 0.10;
      if (exactGoal && !willFinalGoalQuiz) {
        showSquareMessage(teamIndex, goalIndex);
        await waitForSquareMessage(3000);
      }

      const goalEvent = await handleGoalContact(teamIndex, exactGoal, goalEventRoll);

      if (goalEvent.type === 'allnight' || goalEvent.type === 'jam') {
        isMoving = false;
        if (goalEvent.type === 'allnight') {
          isMoving = false;
          advanceTurn();
          scheduleCameraForNextTeam(100);
          return;
        }
        targetPos = gameState.positions[teamIndex];
      } else if (goalEvent.type === 'finalGoalQuiz') {
        isMoving = false;
        return;
      } else if (rawTarget > goalIndex) {
        // オーバーした場合は超過分だけ戻る。
        const bounceTarget = Math.max(0, goalIndex - (rawTarget - goalIndex));
        if (bounceTarget !== goalIndex) {
          showReturnBanner();
          showScreenMessage(`⏳ 時を戻そう！<br><span style="font-size:11px;">${rawTarget - goalIndex}マス戻ります。</span>`, 1800);
          await new Promise(r => setTimeout(r, 1800));
          await movePieceStepByStep(teamIndex, goalIndex, bounceTarget, true);
          gameState.positions[teamIndex] = bounceTarget;
          syncGameState();
          updateBoardImage();
          showSquareMessage(teamIndex, bounceTarget);
          await waitForSquareMessage(3000);
        }
        targetPos = bounceTarget;
      } else {
        targetPos = goalIndex;
      }
    } else {
      const triggerProducerMeet = targetPos === 7 && Math.random() < 0.10;
      await movePieceStepByStep(teamIndex, oldPos, targetPos, false);
      gameState.positions[teamIndex] = targetPos;
      syncGameState();
      updateBoardImage();
      if (!triggerProducerMeet) {
        showSquareMessage(teamIndex, targetPos);
        await waitForSquareMessage(3000);
      }

      // マス13のアナウンス後に「キノコターイム！」を開催。
      if (diceLandedPos === 13 && !gameState.activeMushroomTime && !gameState.isGameOver) {
        isMoving = false;
        startMushroomTimeEvent();
        await new Promise(resolve => {
          const wait = setInterval(() => {
            if (!gameState.activeMushroomTime && gameState.mushroomTime && gameState.mushroomTime.resultApplied) {
              clearInterval(wait);
              resolve();
            }
          }, 150);
          setTimeout(() => { clearInterval(wait); resolve(); }, 10000);
        });
        return;
      }

      // マス14のアナウンスが終わってからミャクニョッキを開始。
      if (diceLandedPos === 14 && !gameState.activeMyakuNyokki && !gameState.isGameOver) {
        isMoving = false;
        startMyakuNyokkiEvent();
        await new Promise(resolve => {
          const wait = setInterval(() => {
            if (!gameState.activeMyakuNyokki && gameState.myakuNyokki && gameState.myakuNyokki.resultApplied) {
              clearInterval(wait);
              resolve();
            }
          }, 150);
          setTimeout(() => { clearInterval(wait); resolve(); }, 15000);
        });
        return;
      }

      if (targetPos === 12 && !gameState.isGameOver) {
        isMoving = false;
        // オプチャからの通知らしいアラーム音を全端末で共有。
        // サイコロを押した時点でAudioContextを解除し、さらにFirebase経由でも共有する。
        soundEffect.opchatAlarm();
        publishSharedSound('opchatAlarm');
        showScreenMessage(
          `16:50 オプチャから通知が届く！<br>まもなく17時に電力館、nullダイアログ、ガンダム、いのちの未来の当日予約開放です📢`,
          3000
        );
        await new Promise(r => setTimeout(r, 3000));
        showScreenMessage(
          `チームで当日予約に挑戦だ‼️<br>※予約画面が表示されたら素早くタップ`,
          2000
        );
        await new Promise(r => setTimeout(r, 2000));
        startYoyakuEvent(teamIndex);
        await new Promise(resolve => {
          const wait = setInterval(() => {
            if (!gameState.yoyakuEvent || gameState.yoyakuEvent.resultApplied) {
              clearInterval(wait);
              resolve();
            }
          }, 100);
          setTimeout(() => { clearInterval(wait); resolve(); }, 10000);
        });
        return;
      }
      if (triggerProducerMeet) {
        showSignBanner();
        pushLog(`😊 ${teamNames[teamIndex]} がマス7でシグネチャーパビリオンのプロデューサーに遭遇！2マス進みます！`);
        await new Promise(r => setTimeout(r, 2200));
        const effectTarget = Math.min(goalIndex, targetPos + 2);
        await movePieceStepByStep(teamIndex, targetPos, effectTarget, false);
        gameState.positions[teamIndex] = effectTarget;
        syncGameState();
        updateBoardImage();
        showSquareMessage(teamIndex, effectTarget);
        await waitForSquareMessage(3000);
        targetPos = effectTarget;
      }
    }

    // 以降の追加移動（雨・マス効果）で到着したマスの効果は発動させない。

    // 1・2・4・6マスに止まったとき、10%の確率で突然の雨。
    if ([1, 2, 4, 6].includes(diceLandedPos) && Math.random() < 0.10) {
      showRainEffectBanner();
      pushLog(`🌧️ ${teamNames[teamIndex]} がマス${targetPos}に到着すると突然の雨！遠回りになり、大屋根リングの下を通るため1マス戻ります。`);
      await new Promise(r => setTimeout(r, 2200));

      const backTargetPos = Math.max(0, targetPos - 1);
      await movePieceStepByStep(teamIndex, targetPos, backTargetPos, true);
      gameState.positions[teamIndex] = backTargetPos;
      syncGameState();
      updateBoardImage();
      showSquareMessage(teamIndex, backTargetPos);
      await waitForSquareMessage(3000);
      targetPos = backTargetPos;
    }

    // マス6に止まったら、通常マス表示の後に「こみゃくパニック！」を開催。
    // こみゃくパニック自体が終了するまで、このターンは進めない。
    if (diceLandedPos === 6 && !gameState.kmyakSpawnActive && !gameState.isGameOver) {
      triggerKmyakSpawnEvent();
      await new Promise(resolve => {
        const wait = setInterval(() => {
          if (gameState.kmyakSpawnResolved || !gameState.kmyakSpawnActive && gameState.kmyakSpawnTriggered && Date.now() > (gameState.kmyakSpawnTargetTime || 0) + 3500) {
            clearInterval(wait);
            resolve();
          }
        }, 200);
        setTimeout(() => { clearInterval(wait); resolve(); }, 9000);
      });

      // こみゃくパニック終了処理がこのターンを引き継いで次のチームへ進める。
      // 元のサイコロ処理はここで終了し、同じターンをもう一度進めない。
      isMoving = false;
      refreshDiceAvailability();
      updateUI();
      return;
    }

    // マスの効果を、サイコロで「止まった」ときに必ず発動する。
    // 追加移動先でさらに別のマス効果を連鎖させないことで、9→11→9の無限ループを防ぐ。
    const landedEvent = tileEvents[diceLandedPos];
    if (landedEvent && landedEvent.effect) {
      if (landedEvent.effect === 'skip') {
        gameState.skipTurns[teamIndex] = true;
        syncGameState();
        soundEffect.return();
        pushLog(`⏸️ ${teamNames[teamIndex]} はマス${targetPos}の効果で次の1回を休みます。`);
        showScreenMessage(`⏸️ ${teamNames[teamIndex]} は1回休み！`, 2500);
        await waitForSquareMessage(2500);
      } else if (landedEvent.effect === 'forward') {
        const effectStartPos = targetPos;
        const effectTarget = Math.min(goalIndex, effectStartPos + (landedEvent.value || 1));
        soundEffect.goal();
        pushLog(`➡️ ${teamNames[teamIndex]} はマス${targetPos}の効果で${landedEvent.value || 1}マス進みます！`);
        showScreenMessage(`➡️ ${landedEvent.value || 1}マス進む！`, 2000);
        await new Promise(r => setTimeout(r, 1800));
        await movePieceStepByStep(teamIndex, targetPos, effectTarget, false);
        gameState.positions[teamIndex] = effectTarget;
        syncGameState();
        updateBoardImage();
        showSquareMessage(teamIndex, effectTarget);
        await waitForSquareMessage(3000);
        targetPos = effectTarget;
      } else if (landedEvent.effect === 'back') {
        const effectStartPos = targetPos;
        const effectTarget = Math.max(0, effectStartPos - (landedEvent.value || 1));
        showReturnBanner();
        pushLog(`⬅️ ${teamNames[teamIndex]} はマス${targetPos}の効果で${landedEvent.value || 1}マス戻ります！`);
        showScreenMessage(`⬅️ ${landedEvent.value || 1}マス戻る！`, 2000);
        await new Promise(r => setTimeout(r, 1800));
        await movePieceStepByStep(teamIndex, effectStartPos, effectTarget, true);
        gameState.positions[teamIndex] = effectTarget;
        syncGameState();
        updateBoardImage();
        showSquareMessage(teamIndex, effectTarget);
        await waitForSquareMessage(3000);
        targetPos = effectTarget;
      } else if (landedEvent.effect === 'fireworks') {
        // 17マス目に止まるたびに花火だけを発動。1回休みにはしない。
        triggerSpecialEffect('fireworks');
        pushLog(`🎆 ${teamNames[teamIndex]} がマス17に到着！大輪の花火が打ち上がりました！`);
        showScreenMessage(`🎆✨ 一瞬の輝きを<br>　　 一生の思い出に ✨🎆`, 3000);
        await new Promise(r => setTimeout(r, 3000));
      } else if (landedEvent.effect === 'drone') {
        // 18マス目に止まるたびにドローンショーを発動。
        triggerSpecialEffect('drone');
        pushLog(`🛸 ${teamNames[teamIndex]} がマス18に到着！幻想的なドローンショーが始まりました！`);
        showScreenMessage(`🛸✨ 願いを心に思い浮かべて<br>　　 夜空を見上げてみてください ✨🛸`, 3000);
        await waitForSquareMessage(3500);
        // ドローンショーとアナウンスが終わった後、20%で特別演出。
        if (Math.random() < 0.20) {
          showMyak5Reveal(true);
          await new Promise(r => setTimeout(r, 6500));
        }
      }
    }

    if (targetPos === goalIndex) {
      soundEffect.goal();
      const winningMembers = Object.values(allUsers)
        .filter(u => u.team === teamIndex)
        .map(u => u.name)
        .join("、");

      pushLog(`🎉 優勝：${teamNames[teamIndex]}！ おめでとう！ 🎉`);
      showWinBanner(teamNames[teamIndex], winningMembers);
      gameState.isGameOver = true;
      syncGameState();
      updateUI();
      isMoving = false;
      zoomOutAfterGameOver();
      return;
    }

    if (targetPos === 5 && !gameState.lotteryTriggered) {
      gameState.lotteryTriggered = true;
      syncGameState();
      isMoving = false;
      triggerLotteryEvent(teamIndex);
      return;
    }

    if (targetPos === 10 && !gameState.quizTriggered) {
      isMoving = false;
      triggerQuizEvent();
      return;
    }

    if (targetPos === 15) {
      const triggeredTeams = Array.isArray(gameState.kmyakBattleTriggeredTeams)
        ? gameState.kmyakBattleTriggeredTeams
        : [false, false, false, false];
      const triggeredCount = triggeredTeams.filter(Boolean).length;
      const alreadyTriggered = !!triggeredTeams[teamIndex];

      if (!alreadyTriggered && triggeredCount < 3) {
        triggeredTeams[teamIndex] = true;
        gameState.kmyakBattleTriggeredTeams = triggeredTeams;
        // 旧フラグは互換用に「3チーム到着済み」のときだけtrueにする。
        gameState.kmyakBattleTriggered = triggeredCount + 1 >= 3;
        gameState.kmyakBattleTeamIndex = teamIndex;
        syncGameState();
        isMoving = false;
        startKmyakBattleEvent(teamIndex);
        return;
      }
      // 4番目のチームは15マス目でイベントを発生させず、そのままターン終了。
    }

    isMoving = false;
    advanceTurn();
    scheduleCameraForNextTeam(50);
  }

  function publishSharedMoveEvent(teamIndex, fromPos, toPos, isBackward = false) {
    if (!window.dbRef || applyingSharedMoveEvent) return null;
    const { ref, update, db } = window.dbRef;
    const now = Date.now();
    const stepCount = Math.abs(toPos - fromPos);
    if (stepCount === 0) return null;

    const path = [];
    for (let step = 1; step <= stepCount; step++) {
      path.push(isBackward ? fromPos - step : fromPos + step);
    }

    const event = {
      id: `${now}-${Math.random().toString(36).slice(2, 8)}`,
      type: 'pieceMove',
      teamIndex,
      fromPos,
      toPos,
      path,
      stepDuration: 250,
      cameraZoom: 1.75,
      cameraDuration: 280,
      createdAt: now
    };
    lastSharedMoveEventId = event.id;
    // 後続のsyncGameState()でイベントが消えないよう、ローカル状態にも保持する。
    gameState.sharedMoveEvent = event;
    update(ref(db, 'gameState/sharedMoveEvent'), event);
    return event;
  }

  async function playSharedMoveEvent(moveEvent) {
    if (!moveEvent || moveEvent.type !== 'pieceMove' || !Array.isArray(moveEvent.path)) return;

    applyingSharedMoveEvent = true;
    try {
      const teamIndex = Number(moveEvent.teamIndex);
      const stepDuration = Number(moveEvent.stepDuration) || 250;
      const cameraZoom = Number(moveEvent.cameraZoom) || 1.75;
      const cameraDuration = Number(moveEvent.cameraDuration) || 280;

      for (const currentPos of moveEvent.path) {
        gameState.positions[teamIndex] = currentPos;
        updatePiecePosition(teamIndex, currentPos);
        updateBoardImage();
        // カメラと効果音はイベントを受け取った各端末でローカル再生する。
        // それらを別々のFirebaseイベントとして送らないことで重複を防ぐ。
        focusCameraOnPosition(currentPos, cameraZoom, cameraDuration, false);
        soundEffect.step();
        await new Promise(resolve => setTimeout(resolve, stepDuration));
      }
    } finally {
      applyingSharedMoveEvent = false;
    }
  }

  async function movePieceStepByStep(teamIndex, fromPos, toPos, isBackward = false) {
    const stepCount = Math.abs(toPos - fromPos);
    if (stepCount === 0) return;

    // 「1マスごとの位置」をFirebaseへ送らず、今回の移動全体を1イベントとして共有する。
    // 送信元も受信側も同じpathを再生するため、10人以上の接続でもイベント数は大幅に減る。
    publishSharedMoveEvent(teamIndex, fromPos, toPos, isBackward);

    applyingSharedMoveEvent = true;
    try {
      const path = [];
      for (let step = 1; step <= stepCount; step++) {
        path.push(isBackward ? fromPos - step : fromPos + step);
      }

      for (const currentPos of path) {
        gameState.positions[teamIndex] = currentPos;
        updatePiecePosition(teamIndex, currentPos);
        updateBoardImage();
        focusCameraOnPosition(currentPos, 1.75, 280, false);
        soundEffect.step();
        await new Promise(resolve => setTimeout(resolve, 250));
      }
    } finally {
      applyingSharedMoveEvent = false;
    }
  }

  function updatePiecePosition(teamIndex, pos) {
    const piece = document.getElementById(`piece-${teamIndex}`);
    if (!piece || tilePositions.length === 0) return;

    // コマの位置は計算済み座標ではなく、実際に表示されているマスのDOM位置を基準にする。
    // スマホの画面サイズ変更・縦横切替・初期表示のタイミングが変わっても、
    // コマが必ず対応するマスの中心に重なるようにする。
    const targetTile = tilePositions[pos];
    const targetTileEl = document.getElementById(`tile-${pos}`);
    if (!targetTile && !targetTileEl) return;

    const baseX = targetTileEl ? targetTileEl.offsetLeft : targetTile.x;
    const baseY = targetTileEl ? targetTileEl.offsetTop : targetTile.y;

    const sameTeamPieces = [];
    for (let i = 0; i < 4; i++) {
      if (gameState.positions[i] === pos) {
        sameTeamPieces.push(i);
      }
    }

    const indexInTile = sameTeamPieces.indexOf(teamIndex);
    const totalInTile = sameTeamPieces.length;

    let offsetX = 0;
    let offsetY = 0;

    if (totalInTile > 1) {
      const angle = (indexInTile / totalInTile) * 2 * Math.PI;
      const radius = window.innerWidth < 768 ? 6 : 14;
      offsetX = Math.cos(angle) * radius;
      offsetY = Math.sin(angle) * radius;
    }

    piece.style.left = `${baseX + offsetX}px`;
    piece.style.top = `${baseY + offsetY}px`;
  }

  function updateUI() {
    for (let i = 0; i < 4; i++) {
      updatePiecePosition(i, gameState.positions[i]);
    }

    const currentTeam = gameState.currentTeamIndex;
    const turnIndicator = document.getElementById('turn-indicator');
    if (turnIndicator) {
      turnIndicator.innerText = `順番：${teamNames[currentTeam]}`;
      turnIndicator.style.color = teamColorsHex[currentTeam];
    }

    const playerIndicator = document.getElementById('player-indicator');
    if (playerIndicator) {
      if (isSpectator) {
        playerIndicator.innerText = '👀 観覧モード';
        playerIndicator.style.color = '#6c757d';
        playerIndicator.style.fontWeight = 'bold';
      }
      const list = getRealTeamPlayers(currentTeam);
      const pIdx = gameState.playerIndices[currentTeam] || 0;
      const currentTurnPlayer = list.length ? list[pIdx % list.length] : "🤖 CPU";
      if (!isSpectator) {
        playerIndicator.innerText = `担当: ${currentTurnPlayer}${list.length ? "さん" : "（ふつう）"}`;
      }
      
      if (myUserName === currentTurnPlayer && myTeamIndex === currentTeam) {
        playerIndicator.style.color = "#d9534f";
        playerIndicator.style.fontWeight = "bold";
