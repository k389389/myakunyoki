        playerIndicator.style.color = "#007bff";
        playerIndicator.style.fontWeight = "normal";
      }
    }

    const rollBtn = document.getElementById('roll-btn');
    if (rollBtn) {
      if (isMyTurn() && !gameState.turnActionLocked && !gameState.quizTurnLocked && !gameState.quizCountdownActive && !gameState.quizRoundCountdownStarted) {
        rollBtn.disabled = false;
        rollBtn.innerText = "サイコロを振る！";
        rollBtn.style.background = "#e60012";
      } else {
        rollBtn.disabled = true;
        rollBtn.innerText = "他のプレイヤーの順番です";
        rollBtn.style.background = "#ccc";
      }
    }

    const proxyRollBtn = document.getElementById('proxy-roll-btn');
    if (proxyRollBtn) {
      const kmyakResultRecoveryAvailable = gameState.activeKmyakBattle && gameState.kmyakBattlePhase === "result";
      if (gameState.gameStarted && !gameState.isGameOver && !activeQuiz && !gameState.activeQuiz &&
          !gameState.quizTurnLocked && !gameState.quizCountdownActive && !gameState.quizRoundCountdownStarted &&
          !gameState.activeLottery && (!gameState.activeKmyakBattle || kmyakResultRecoveryAvailable) && !gameState.activeMyakuNyokki &&
          !gameState.activeMushroomTime && !gameState.mushroomTimeTurnLocked) {
        proxyRollBtn.disabled = false;
        proxyRollBtn.innerText = "🤖 代理で振る";
      } else {
        // イベント中だけ無効。turnActionLockedだけでは無効にしない。
        const kmyakResultRecoveryAvailable = gameState.activeKmyakBattle && gameState.kmyakBattlePhase === "result";
        const eventBlocked = !gameState.gameStarted || gameState.isGameOver || activeQuiz ||
          gameState.activeQuiz || gameState.quizTurnLocked || gameState.quizCountdownActive ||
          gameState.quizRoundCountdownStarted || gameState.activeLottery ||
          (gameState.activeKmyakBattle && !kmyakResultRecoveryAvailable) || gameState.activeMyakuNyokki ||
          gameState.activeMushroomTime || gameState.mushroomTimeTurnLocked;
        proxyRollBtn.disabled = eventBlocked;
      }
    }

    const membersContainer = document.getElementById('members-container');
    if (membersContainer) {
      let html = '';
      for (let i = 0; i < 4; i++) {
        const tColorClass = teams[i];
        const tName = teamNames[i];
        const members = teamPlayers[i];
        
        const currentPIdx = gameState.playerIndices[i] || 0;
        const activePlayerName = members[currentPIdx % members.length];

        let memberTags = members.map(m => {
          let tagClass = "member-tag";
          if (m === activePlayerName && !members[0].includes("募集中")) {
            tagClass += " active-turn";
          }
          return `<span class="${tagClass}">${m}</span>`;
        }).join(" ");

        html += `
          <div style="margin-bottom:3px;">
            <div class="member-team ${tColorClass}">${tName}</div>
            <div class="member-list">${memberTags}</div>
          </div>
        `;
      }
      const spectatorNames = Object.values(allSpectators || {}).map(u => u && u.name).filter(Boolean);
      html += `
        <div style="margin-top:6px; padding-top:5px; border-top:1px solid #ddd;">
          <div class="member-team" style="background:#f1c40f; color:#333;">👀 観覧者</div>
          <div class="member-list">${spectatorNames.length ? spectatorNames.map(n => `<span class="member-tag" style="background:#f5f5f5; color:#666; border:1px solid #ccc;">${n}</span>`).join(" ") : '<span style="font-size:10px;color:#999;">現在いません</span>'}</div>
        </div>`;
      membersContainer.innerHTML = html;
    }

    const lobby = document.getElementById('lobby-overlay');
    const lobbyUsers = document.getElementById('lobby-users');
    const startBtn = document.getElementById('start-game-btn');
    const lobbyStatus = document.getElementById('lobby-team-status');
    if (lobby && lobbyUsers) {
      const names = Object.values(allUsers).map(u => u.name).filter(Boolean);
      lobbyUsers.innerHTML = names.length ? names.map(n => `👤 ${n}`).join('<br>') : '参加者はいません';
      if (lobbyStatus) {
        const cpuTeams = [0,1,2,3].filter(i => getRealTeamPlayers(i).length === 0).map(i => teamNames[i]);
        lobbyStatus.innerText = cpuTeams.length ? `未参加のチーム：${cpuTeams.join('・')} → ゲーム開始後はCPU（ふつう）が操作` : '4チームすべてにプレイヤーがいます！';
      }
      if (startBtn) startBtn.disabled = isSpectator || !myUserName || names.length === 0 || gameState.gameStarted;
      lobby.style.display = (myUserName && !isSpectator && !gameState.gameStarted) ? 'flex' : 'none';
    }
    if (gameState.gameStarted) scheduleCpuTurn();
  }

  window.rollDiceProxy = async function() {
    if (!gameState.gameStarted || gameState.isGameOver) {
      alert('ゲームが開始されていません。');
      return;
    }

    // 15マス目の結果画面が端末間の競合などで残った場合は、
    // 「代理で振る」で結果表示を閉じ、次のターンへ復旧してからサイコロを振る。
    if (gameState.activeKmyakBattle && gameState.kmyakBattlePhase === 'result') {
      if (!confirm('15マス目のイベント結果画面が残っています。結果を確定して、次のターンを代理で進めますか？')) return;

      // 押した端末のローカル状態ではなくFirebaseの最新状態を基準に復旧する。
      // 別端末がすでに復旧済みでも、ここで最新状態へ追従できる。
      const recovered = await recoverStuckKmyakBattle(gameState.kmyakBattleEventId);
      if (!recovered) {
        alert('まだ復旧処理中です。少し待ってからもう一度「代理で振る」を押してください。');
        return;
      }

      // 別端末がすでに次のターンへ進めていた場合は、
      // 現在のFirebase状態を優先し、同じターンを二重に進めない。
      await executeDiceRoll({ proxy: true, recovery: true });
      return;
    }

    // クイズ・イベント中だけは誤操作を防ぐ。
    // turnActionLocked は「停止してしまった時」に解除して代理で振るため、
    // ここではブロックしない。
    if (activeQuiz || gameState.activeQuiz || gameState.quizTurnLocked ||
        gameState.quizCountdownActive || gameState.quizRoundCountdownStarted ||
        gameState.activeLottery || gameState.activeKmyakBattle ||
        gameState.activeMyakuNyokki || gameState.activeMushroomTime ||
        gameState.mushroomTimeTurnLocked) {
      alert('現在はイベント処理中のため、代理で振れません。');
      return;
    }

    // 同じ端末で移動処理が固まった場合だけ、20秒経過後に代理で救済できる。
    // 正常な移動中に代理で割り込むことは防ぐ。
    if (isMoving && (!lastRollTime || Date.now() - lastRollTime < 20000)) {
      alert('現在は移動処理中です。20秒以上止まっている場合に代理で振れます。');
      return;
    }

    const teamIndex = Number(gameState.currentTeamIndex);
    if (!Number.isInteger(teamIndex) || teamIndex < 0 || teamIndex >= 4) return;

    const teamNames = ['赤チーム', '青チーム', '緑チーム', '黄チーム'];
    const teamName = teamNames[teamIndex] || '現在のチーム';

    if (!confirm(
      `${teamName}のサイコロを代理で振りますか？\n\n` +
      `通常のプレイヤーやCPUが振れない時の救済用です。\n` +
      `止まっている場合は、このボタンで再開できます。`
    )) return;

    // recovery:true により、自分のターン判定・古いturnActionLocked・
    // 同端末に残ったフリーズ中のisMovingに依存せず、
    // Firebase上の「現在のチーム」を基準に1回だけ振る。
    await executeDiceRoll({ proxy: true, recovery: true });
  };

  window.sendChatMessage = function() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    if (!myUserName) {
      alert("名前を入力して参加してからチャットしてください！");
      return;
    }

    const { ref, push, db } = window.dbRef;
    const now = new Date();
    const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

    push(ref(db, 'chats'), {
      name: myUserName,
      team: isSpectator ? -1 : myTeamIndex,
      spectator: isSpectator,
      text: text,
      time: timeStr,
      timestamp: Date.now()
    });

    input.value = '';
  };

  function pushLog(message) {
    const { ref, push, db } = window.dbRef;
    push(ref(db, 'logs'), message);
  }

  // ===== ライブトーク（代表者だけマイクON／OFFの人も聞ける方式） =====
  // ゲーム本体とは分離。ONするたびに新しいセッションIDを発行し、
  // 前回のoffer/answer/ICE候補と新しい接続が混ざらないようにします。
  let liveTalkStream = null;
  let liveTalkEnabled = false;
  let liveTalkSessionId = null;
  let liveTalkPeers = {};
  let liveTalkAudioEls = {};
  let liveTalkUnsubs = {};
  let liveTalkActiveUnsub = null;
  let liveTalkUsersUnsub = null;
  let liveTalkSpeakerSessions = {};

  const liveTalkRtcConfig = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]
  };

  function liveTalkFirebase() {
    const d = window.liveTalkDbRef;
    if (!d || !d.db || typeof d.ref !== 'function') {
      throw new Error('ライブトーク用Firebaseがまだ準備できていません');
    }
    return d;
  }

  function liveTalkKey(name) {
    return encodeURIComponent(String(name || ''));
  }

  function liveTalkNewSessionId() {
    if (window.crypto && typeof crypto.randomUUID === 'function') {
      return crypto.randomUUID();
    }
    return Date.now().toString(36) + '-' +
      Math.random().toString(36).slice(2) +
      '-' + Math.random().toString(36).slice(2);
  }

  function liveTalkPeerNames() {
    return Object.keys(allUsers || {})
      .map(k => {
        try { return decodeURIComponent(k); } catch (e) { return k; }
      })
      .filter(name => name && name !== myUserName);
  }

  function liveTalkSessionPath(speakerName, receiverName, sessionId) {
    return 'liveTalk/sessions/' +
      liveTalkKey(speakerName) + '/' +
      liveTalkKey(receiverName) + '/' +
      liveTalkKey(sessionId);
  }

  function liveTalkPath(path) {
    const d = liveTalkFirebase();
    return d.ref(d.db, path);
  }

  function liveTalkCleanupPeer(id) {
    const state = liveTalkPeers[id];
    if (state) {
      try { state.pc.close(); } catch (e) {}
      delete liveTalkPeers[id];
    }

    const audio = liveTalkAudioEls[id];
    if (audio) {
      try { audio.pause(); } catch (e) {}
      audio.srcObject = null;
      audio.remove();
      delete liveTalkAudioEls[id];
    }

    const unsubs = liveTalkUnsubs[id];
    if (unsubs) {
      unsubs.forEach(fn => { try { fn(); } catch (e) {} });
      delete liveTalkUnsubs[id];
    }
  }

  function liveTalkUnlockAudio() {
    try {
      if (window.AudioContext || window.webkitAudioContext) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!window.__liveTalkAudioContext) {
          window.__liveTalkAudioContext = new Ctx();
        }
        const ctx = window.__liveTalkAudioContext;
        if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      }
    } catch (e) {}

    Object.values(liveTalkAudioEls).forEach(audio => {
      if (!audio) return;
      audio.play().catch(() => {});
    });
  }

  function liveTalkInstallAudioUnlock() {
    if (window.__liveTalkAudioUnlockInstalled) return;
    window.__liveTalkAudioUnlockInstalled = true;

    const unlock = () => liveTalkUnlockAudio();
    document.addEventListener('pointerdown', unlock, { passive: true });
    document.addEventListener('touchstart', unlock, { passive: true });
    document.addEventListener('keydown', unlock, { passive: true });
  }

  function liveTalkCreateAudio(id, stream) {
    let audio = liveTalkAudioEls[id];

    if (!audio) {
      audio = document.createElement('audio');
      audio.autoplay = true;
      audio.playsInline = true;
      audio.controls = false;
      audio.muted = false;
      audio.volume = 1;
      audio.style.display = 'none';
      document.body.appendChild(audio);
      liveTalkAudioEls[id] = audio;
    }

    audio.srcObject = stream;
    liveTalkUnlockAudio();

    const playPromise = audio.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(() => {
        const retry = () => audio.play().catch(() => {});
        document.addEventListener('click', retry, { once: true });
        document.addEventListener('touchstart', retry, { once: true });
      });
    }
  }

  async function liveTalkAddCandidates(pc, state, candidates) {
    for (const candidate of candidates) {
      try {
        if (pc.remoteDescription) {
          await pc.addIceCandidate(new RTCIceCandidate(candidate));
        } else {
          state.candidateQueue.push(candidate);
        }
      } catch (e) {}
    }
  }

  async function liveTalkFlushCandidates(pc, state) {
    if (!pc.remoteDescription || !state.candidateQueue.length) return;

    const queue = state.candidateQueue.splice(0);
    for (const candidate of queue) {
      try {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (e) {}
    }
  }

  async function liveTalkCreateSpeakerPeer(receiverName) {
    if (!liveTalkEnabled || !liveTalkSessionId ||
        !myUserName || !receiverName || receiverName === myUserName) return;

    const sessionId = liveTalkSessionId;
    const id = 'send:' + receiverName + ':' + sessionId;

    if (liveTalkPeers[id]) return;

    const { set, onValue, push, db } = liveTalkFirebase();
    const sessionPath = liveTalkSessionPath(myUserName, receiverName, sessionId);
    const state = { pc: null, candidateQueue: [], sessionId };
    const pc = new RTCPeerConnection(liveTalkRtcConfig);

    state.pc = pc;
    liveTalkPeers[id] = state;
    liveTalkUnsubs[id] = [];

    if (liveTalkStream) {
      liveTalkStream.getTracks().forEach(track => pc.addTrack(track, liveTalkStream));
    }

    pc.onicecandidate = async event => {
      if (!event.candidate || !liveTalkEnabled ||
          liveTalkSessionId !== sessionId) return;

      await push(
        liveTalkPath(sessionPath + '/candidates/speaker'),
        event.candidate.toJSON()
      ).catch(() => {});
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
        liveTalkCleanupPeer(id);

        if (liveTalkEnabled &&
            liveTalkSessionId === sessionId &&
            pc.connectionState === 'failed') {
          setTimeout(() => {
            if (liveTalkEnabled && liveTalkSessionId === sessionId) {
              liveTalkCreateSpeakerPeer(receiverName).catch(() => {});
            }
          }, 1000);
        }
      }
    };

    const answerUnsub = onValue(
      liveTalkPath(sessionPath + '/answer'),
      async snap => {
        if (!liveTalkEnabled || liveTalkSessionId !== sessionId) return;

        const answer = snap.val();
        if (!answer || pc.signalingState !== 'have-local-offer') return;

        try {
          await pc.setRemoteDescription(
            new RTCSessionDescription({
              type: answer.type,
              sdp: answer.sdp
            })
          );
          await liveTalkFlushCandidates(pc, state);
        } catch (e) {}
      }
    );
    liveTalkUnsubs[id].push(answerUnsub);

    const candUnsub = onValue(
      liveTalkPath(sessionPath + '/candidates/receiver'),
      async snap => {
        if (!liveTalkEnabled || liveTalkSessionId !== sessionId) return;
        const vals = snap.val() || {};
        await liveTalkAddCandidates(pc, state, Object.values(vals));
      }
    );
    liveTalkUnsubs[id].push(candUnsub);

    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      if (!liveTalkEnabled || liveTalkSessionId !== sessionId) {
        liveTalkCleanupPeer(id);
        return;
      }

      await set(liveTalkPath(sessionPath + '/offer'), {
        type: offer.type,
        sdp: offer.sdp,
        from: myUserName,
        sessionId,
        timestamp: Date.now()
      });
    } catch (e) {
      liveTalkCleanupPeer(id);
    }
  }

  async function liveTalkCreateReceiverPeer(speakerName, sessionId, offer) {
    if (!myUserName || !speakerName || speakerName === myUserName ||
        !sessionId || !offer) return;

    const id = 'recv:' + speakerName + ':' + sessionId;
    if (liveTalkPeers[id]) return;

    const { set, onValue, push, db } = liveTalkFirebase();
    const sessionPath = liveTalkSessionPath(speakerName, myUserName, sessionId);

    const pc = new RTCPeerConnection(liveTalkRtcConfig);
    const state = { pc, candidateQueue: [], sessionId };

    liveTalkPeers[id] = state;
    liveTalkUnsubs[id] = [];

    pc.ontrack = event => {
      const stream = event.streams && event.streams[0];
      if (stream) liveTalkCreateAudio(id, stream);
    };

    pc.onicecandidate = async event => {
      if (!event.candidate) return;

      await push(
        liveTalkPath(sessionPath + '/candidates/receiver'),
        event.candidate.toJSON()
      ).catch(() => {});
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
        liveTalkCleanupPeer(id);
      }
    };

    const speakerCandUnsub = onValue(
      liveTalkPath(sessionPath + '/candidates/speaker'),
      async snap => {
        const vals = snap.val() || {};
        await liveTalkAddCandidates(pc, state, Object.values(vals));
      }
    );
    liveTalkUnsubs[id].push(speakerCandUnsub);

    try {
      await pc.setRemoteDescription(
        new RTCSessionDescription({
          type: offer.type,
          sdp: offer.sdp
        })
      );

      await liveTalkFlushCandidates(pc, state);

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      await set(liveTalkPath(sessionPath + '/answer'), {
        type: answer.type,
        sdp: answer.sdp,
        from: myUserName,
        sessionId,
        timestamp: Date.now()
      });
    } catch (e) {
      liveTalkCleanupPeer(id);
    }
  }

  function liveTalkRemoveSpeakerListener(speakerName) {
    const listenerId = 'listener:' + speakerName;
    const arr = liveTalkUnsubs[listenerId];

    if (arr) {
      arr.forEach(fn => { try { fn(); } catch (e) {} });
      delete liveTalkUnsubs[listenerId];
    }
  }

  function liveTalkCleanupReceiver(speakerName) {
    Object.keys(liveTalkPeers).forEach(id => {
      if (id.startsWith('recv:' + speakerName + ':')) {
        liveTalkCleanupPeer(id);
      }
    });
  }

  async function liveTalkHandleActiveSpeakers(active) {
    const speakers = active || {};
    const activeMap = {};

    Object.values(speakers).forEach(v => {
      if (v && v.name && v.sessionId) {
        activeMap[v.name] = v.sessionId;
      }
    });

    // 自分が代表者なら、現在参加している全員へ音声を送る。
    if (liveTalkEnabled && liveTalkSessionId) {
      for (const name of liveTalkPeerNames()) {
        await liveTalkCreateSpeakerPeer(name);
      }
    }

    // マイクOFFの人も、各代表者の「現在のセッション」だけを監視。
    for (const speakerName of Object.keys(activeMap)) {
      if (!speakerName || speakerName === myUserName) continue;

      const sessionId = activeMap[speakerName];
      const listenerId = 'listener:' + speakerName;
      const current = liveTalkSpeakerSessions[speakerName];

      if (current === sessionId && liveTalkUnsubs[listenerId]) continue;

      // 同じ名前の代表者がOFF→ONした場合は、古い監視・接続を破棄。
      liveTalkRemoveSpeakerListener(speakerName);
      liveTalkCleanupReceiver(speakerName);

      liveTalkSpeakerSessions[speakerName] = sessionId;

      const { onValue } = liveTalkFirebase();
      const sessionPath = liveTalkSessionPath(
        speakerName, myUserName, sessionId
      );

      const unsub = onValue(
        liveTalkPath(sessionPath + '/offer'),
        async snap => {
          const offer = snap.val();
          if (!offer || offer.sessionId !== sessionId) return;
          await liveTalkCreateReceiverPeer(
            speakerName, sessionId, offer
          );
        }
      );

      liveTalkUnsubs[listenerId] = [unsub];
    }

    // OFFになった代表者を停止。
    Object.keys(liveTalkSpeakerSessions).forEach(speakerName => {
      if (!activeMap[speakerName]) {
        liveTalkRemoveSpeakerListener(speakerName);
        liveTalkCleanupReceiver(speakerName);
        delete liveTalkSpeakerSessions[speakerName];
      }
    });
  }

  async function liveTalkConnectAll() {
    if (!liveTalkEnabled || !liveTalkSessionId) return;

    for (const name of liveTalkPeerNames()) {
      await liveTalkCreateSpeakerPeer(name);
    }
  }

  async function liveTalkDisconnectAll() {
    const { remove } = liveTalkFirebase();

    Object.keys(liveTalkPeers).forEach(liveTalkCleanupPeer);

    Object.keys(liveTalkUnsubs).forEach(key => {
      const arr = liveTalkUnsubs[key];
      if (Array.isArray(arr)) {
        arr.forEach(fn => { try { fn(); } catch (e) {} });
      }
      delete liveTalkUnsubs[key];
    });

    // 受信側の監視はマイクOFF後も残す。
    // 自分のマイクをOFFにしても、他端末の声は聞こえるようにする。
    liveTalkSpeakerSessions = {};

    if (myUserName) {
      await remove(
        liveTalkPath('liveTalk/active/' + liveTalkKey(myUserName))
      ).catch(() => {});
    }

    liveTalkSessionId = null;
  }

  function liveTalkStartListeners() {
    const { onValue } = liveTalkFirebase();

    if (!liveTalkActiveUnsub) {
      liveTalkActiveUnsub = onValue(
        liveTalkPath('liveTalk/active'),
        snap => {
          liveTalkHandleActiveSpeakers(snap.val() || {}).catch(() => {});
        }
      );
    }

    // 代表者がONのまま、新しい参加者が入った場合も接続。
    if (!liveTalkUsersUnsub) {
      liveTalkUsersUnsub = onValue(
        liveTalkPath('users'),
        () => {
          if (liveTalkEnabled) liveTalkConnectAll().catch(() => {});
        }
      );
    }
  }

  window.toggleLiveTalk = async function() {
    const btn = document.getElementById('live-talk-btn');
    const status = document.getElementById('live-talk-status');

    if (!myUserName) {
      alert('名前を入力して参加してからライブトークを使ってください！');
      return;
    }

    try {
      liveTalkStartListeners();
      liveTalkInstallAudioUnlock();
      liveTalkUnlockAudio();
    } catch (e) {
      alert('ライブトークの接続準備に失敗しました。ページを再読み込みしてください。');
      return;
    }

    let liveTalkApi;
    try {
      liveTalkApi = liveTalkFirebase();
    } catch (e) {
      status.textContent = 'ライブトーク準備中';
      alert('ライブトーク用Firebaseの準備がまだ完了していません。数秒待ってからもう一度お試しください。');
      return;
    }

    const { set, remove } = liveTalkApi;

    if (!liveTalkEnabled) {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('getUserMedia unavailable');
        }

        liveTalkStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        liveTalkSessionId = liveTalkNewSessionId();
        liveTalkEnabled = true;

        btn.classList.add('active');
        btn.textContent = '🔴 マイクON（タップでOFF）';
        status.textContent = 'マイクON：全員に聞こえます';

        await set(
          liveTalkPath('liveTalk/active/' + liveTalkKey(myUserName)),
          {
            name: myUserName,
            sessionId: liveTalkSessionId,
            timestamp: Date.now()
          }
        );

        await liveTalkConnectAll();
      } catch (e) {
        if (liveTalkStream) {
          liveTalkStream.getTracks().forEach(t => t.stop());
        }

        liveTalkStream = null;
        liveTalkEnabled = false;
        liveTalkSessionId = null;
        btn.classList.remove('active');
        btn.textContent = '🎙️ ライブトーク';
        status.textContent = 'マイクOFF';

        alert(
          'ライブトークを開始できませんでした。\n\n' +
          (e && e.message ? e.message : e) +
          '\n\nゲーム本体はそのまま使用できます。'
        );
      }
    } else {
      const oldSessionId = liveTalkSessionId;

      liveTalkEnabled = false;
      liveTalkSessionId = null;

      if (liveTalkStream) {
        liveTalkStream.getTracks().forEach(t => t.stop());
      }
      liveTalkStream = null;

      await remove(
        liveTalkPath('liveTalk/active/' + liveTalkKey(myUserName))
      ).catch(() => {});

      Object.keys(liveTalkPeers)
        .filter(id => id.startsWith('send:') &&
                      (!oldSessionId || id.endsWith(':' + oldSessionId)))
        .forEach(liveTalkCleanupPeer);

      btn.classList.remove('active');
      btn.textContent = '🎙️ ライブトーク';
      status.textContent = 'マイクOFF（他の人の声は聞こえます）';
    }
  };

  window.onload = function() {
    setupBoard();
    liveTalkInstallAudioUnlock();

    // 保存済みの名前がある場合は、マイクOFFのままでも
    // 他端末のライブトーク受信を開始しておく。
    if (myUserName) {
      try { liveTalkStartListeners(); } catch (e) {}
      liveTalkUnlockAudio();
    }
    window.addEventListener('resize', () => {
      calculateTilePositions();
      for (let i = 0; i < 4; i++) {
        updatePiecePosition(i, gameState.positions[i]);
      }
      if (cameraFocusedTeam !== null) {
        focusCameraOnTeam(cameraFocusedTeam, cameraZoom, 0);
      }
    });
  };
</script>
</body>
